<!doctype html>

<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:flex;align-items:center;gap:56px;padding:0 70px;box-sizing:border-box;font:400 52px/1.05 "Jersey 10",sans-serif;color:#FFF1D0;

.brand{margin:0 0 8px;font-size:52px;color:#BFE7E6}
h1{margin:0 0 26px;font-size:168px;line-height:.85;letter-spacing:2px;

.hook{position:absolute;left:144px;top:428px;width:10px;height:22px;border:5px solid #C9CED6;border-top:0;border-radius:0 0 10px 10px}
img{position:absolute;image-rendering:pixelated}
.fish{width:192px;height:108px;left:60px;top:448px;filter:brightness(.25) saturate(.4)}
