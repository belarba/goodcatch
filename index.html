<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily fishing puzzle. Find the fish of the day in six casts.">
<meta name="theme-color" content="#0B2233">
<title>Good Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
:root{
  color-scheme:dark;
  --abyss:#0B2233; --deep:#0E4A5C;
  --bark:#2E1A0C; --parch:#F6E7C1; --ink:#3B2414; --ink-soft:#6B4A2A;
  --gold:#F2B33D; --cream:#FFF1D0; --sun:#FFE27A;
  --pixel:"Jersey 10",ui-rounded,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--abyss)}
body{margin:0;min-height:100svh;color:var(--cream);font:400 22px/1.15 var(--pixel);image-rendering:pixelated;
  background:var(--sea-tile,none) 0 0/64px 64px,linear-gradient(180deg,#136A82 0,var(--deep) 34%,var(--abyss) 100%) fixed}
::selection{background:var(--sun);color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding:10px 16px 40px;display:flex;flex-direction:column;gap:10px}
.sp{display:block;background:center/contain no-repeat;image-rendering:pixelated}

.wood{border:10px solid transparent;border-image:var(--wood9) 5 fill / 10px round;color:var(--cream);filter:drop-shadow(0 8px 10px rgba(4,16,26,.4))}
.parch{border:10px solid transparent;border-image:var(--parch9) 5 fill / 10px round;color:var(--ink);filter:drop-shadow(0 8px 10px rgba(4,16,26,.4))}
.btn{appearance:none;border:8px solid transparent;border-image:var(--gold9) 4 fill / 8px round;background:none;padding:2px 14px 4px;font:400 28px/1 var(--pixel);color:var(--ink);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{border-image-source:var(--dull9);color:#4A3B26;cursor:default}

.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center;gap:6px}
.icon-btn{appearance:none;width:48px;height:48px;padding:0;display:grid;place-items:center;font-size:22px;line-height:1;cursor:pointer}
.icon-btn .sp{width:24px;height:24px}
.icon-btn:active{transform:translateY(2px)}
h1{margin:0;font:400 clamp(40px,12vw,54px)/.9 var(--pixel);color:var(--cream);letter-spacing:.5px;
  text-shadow:3px 0 var(--bark),-3px 0 var(--bark),0 3px var(--bark),0 -3px var(--bark),3px 3px var(--bark),-3px 3px var(--bark),3px -3px var(--bark),-3px -3px var(--bark),0 7px 0 rgba(4,16,26,.45)}
h1 span{color:var(--gold)}
.date{margin-top:4px;font-size:18px;color:#BFE7E6}

.talk{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}
.face{width:64px;height:56px;filter:drop-shadow(0 6px 6px rgba(4,16,26,.4))}
.bubble{position:relative;min-height:52px;display:flex;align-items:center;padding:0 2px}
.bubble::before,.bubble::after{content:"";position:absolute;top:50%;clip-path:polygon(100% 0,0 50%,100% 100%)}
.bubble::before{left:-26px;width:17px;height:20px;margin-top:-10px;background:var(--bark)}
.bubble::after{left:-20px;width:12px;height:12px;margin-top:-6px;background:var(--parch)}
.bubble p{margin:0;font-size:20px;line-height:1.05}

.sea{position:relative;width:fit-content;margin:0 auto;border:10px solid transparent;border-image:var(--wood9) 5 fill / 10px round;filter:drop-shadow(0 14px 18px rgba(4,16,26,.5))}
.sea canvas{display:block;image-rendering:pixelated}
.grid{position:absolute;left:0;top:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(4,16,26,.35);border:0;padding:0 16px;cursor:pointer;touch-action:manipulation;font:400 22px/1 var(--pixel);color:var(--cream)}
#hook[hidden]{display:none}
#hook .bar{position:relative;width:100%;height:34px;border:10px solid transparent;border-image:var(--parch9) 5 fill / 10px round}
#hook .zone{position:absolute;top:0;bottom:0;background:#5E8E64}
#hook .needle{position:absolute;top:-8px;bottom:-8px;width:6px;margin-left:-3px;background:var(--bark)}
.c{appearance:none;border:0;padding:0;background:transparent;position:relative;cursor:pointer}
.c:disabled{cursor:default}
@media (hover:hover){.c:not(:disabled):hover{background:rgba(255,226,122,.14)}}
:root{--corners:linear-gradient(var(--sun),var(--sun)) 2px 2px/34% 4px no-repeat,linear-gradient(var(--sun),var(--sun)) 2px 2px/4px 34% no-repeat,
  linear-gradient(var(--sun),var(--sun)) calc(100% - 2px) 2px/34% 4px no-repeat,linear-gradient(var(--sun),var(--sun)) calc(100% - 2px) 2px/4px 34% no-repeat,
  linear-gradient(var(--sun),var(--sun)) 2px calc(100% - 2px)/34% 4px no-repeat,linear-gradient(var(--sun),var(--sun)) 2px calc(100% - 2px)/4px 34% no-repeat,
  linear-gradient(var(--sun),var(--sun)) calc(100% - 2px) calc(100% - 2px)/34% 4px no-repeat,linear-gradient(var(--sun),var(--sun)) calc(100% - 2px) calc(100% - 2px)/4px 34% no-repeat}
.c.sel{background:var(--corners),rgba(255,226,122,.18);animation:pulse 1s steps(2) infinite}
.c.win{box-shadow:inset 0 0 0 4px var(--sun);background:rgba(255,226,122,.22)}
.c .tag{position:absolute;right:1px;bottom:1px;min-width:24px;padding:0 3px;border:6px solid transparent;border-image:var(--tag9) 3 fill / 6px;color:var(--ink);font:400 20px/14px var(--pixel);text-align:center}
.c .tag.hit{border-image-source:var(--gold9);border-image-slice:4 fill}

.feat{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:5px solid transparent;border-image:var(--tag9) 3 fill / 6px;padding:0 4px 0 0;color:var(--ink);font-size:20px;background:none}
.chip img{width:24px;height:24px;image-rendering:pixelated}
.key img{width:32px;height:32px;image-rendering:pixelated}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.left{display:flex;gap:2px}
.left i{width:28px;height:28px}
.left i.used{opacity:.3;filter:grayscale(1)}

.result,#catch .parch{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scene{display:block;image-rendering:pixelated;box-shadow:0 0 0 3px var(--bark)}
canvas.banquet{display:block;image-rendering:pixelated}
.big{font:400 84px/.85 var(--pixel);color:var(--gold);
  text-shadow:4px 0 var(--bark),-4px 0 var(--bark),0 4px var(--bark),0 -4px var(--bark),4px 4px var(--bark),-4px 4px var(--bark),4px -4px var(--bark),-4px -4px var(--bark)}
.big.lost{color:#E8826A}
.stars{display:flex;gap:6px}
.stars .sp{width:36px;height:36px}
.result p{margin:0;font-size:22px}
.score{display:flex;align-items:center;justify-content:center;gap:16px}
.score .side{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.score .stars .sp{width:30px;height:30px}
.verdict{margin:0;font-size:20px;line-height:1.05;color:var(--ink-soft);max-width:12em}
.vila{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:2px dashed #D9BE84;text-align:left}
.vila-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vila-head b{font-weight:400;font-size:22px}
.vila .rank{margin:0;font-size:20px;line-height:1.1;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:3px}
.bars span{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;font-size:18px;color:var(--ink-soft)}
.bars b{font-weight:400}
.bars i{display:flex;justify-content:flex-end;align-items:center;height:18px;min-width:24px;padding-right:4px;background:#D9BE84;box-shadow:inset 0 0 0 2px var(--bark);font:400 16px/1 var(--pixel);font-style:normal;color:var(--ink)}
.bars i.zero{height:2px;min-width:0;padding:0;background:#D9BE84;box-shadow:none}
.bars .me i{background:var(--gold)}
.bars .me{color:var(--ink)}
.c .heat{position:absolute;inset:0;background:linear-gradient(rgba(255,226,122,var(--a)) 0 0),rgba(6,20,32,.5);pointer-events:none}
.c.sel .heat{background:var(--corners),linear-gradient(rgba(255,226,122,var(--a)) 0 0),rgba(6,20,32,.5)}
.note{font-size:20px;color:var(--ink-soft)}
.note:empty{display:none}

.book h2{margin:0 0 6px;font:400 26px/1 var(--pixel);color:var(--ink)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed #D9BE84;font-size:22px}
.log li:first-child{border-top:0}
.log li>span:first-child{color:var(--ink-soft)}
.pips{display:flex;gap:4px;align-items:center}
.pips .sp{width:28px;height:28px}
.pips .off{width:20px;height:20px;margin:4px;border-radius:50%;box-shadow:inset 0 0 0 3px #8A6A3A}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;border:6px solid transparent;border-image:var(--tag9) 3 fill / 6px;font-size:20px;color:var(--ink-soft)}
.day.today{border-image-source:var(--gold9);border-image-slice:4 fill}
.day small{font-size:16px;line-height:1}
.day .sp{width:28px;height:22px;background-size:contain}
.day .sp.plate{width:30px;height:10px;margin-top:-4px}
.day .sp.portion-small{width:20px;height:16px}
.day .sp.portion-record{width:36px;height:28px}
.day em{font-style:normal;font-size:16px;line-height:1;color:var(--ink-soft)}
.guest-say{display:flex;align-items:center;gap:8px;margin:0;font-size:20px;line-height:1.1;color:var(--ink);text-align:left}
.guest-say .sp{width:36px;height:36px;flex:none}
.streak{margin:0;font-size:22px;color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
#dex h2{margin:0 0 8px;font:400 30px/1 var(--pixel)}
div.today{display:flex;align-items:center;gap:12px}
div.today>.sp{width:56px;height:44px;flex:none}
div.today>div{flex:1;display:flex;flex-direction:column;line-height:1}
div.today small{font-size:18px;color:var(--ink-soft)}
div.today b{font-weight:400;font-size:26px}
.btn.small{display:inline-flex;align-items:center;gap:6px;font-size:22px;padding:0 10px 2px 6px}
.btn.small .sp{width:24px;height:22px}
.mon{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:6px solid transparent;border-image:var(--tag9) 3 fill / 6px;font-size:16px;line-height:1;text-align:center;color:var(--ink)}
.mon.rare{border-image-source:var(--gold9);border-image-slice:4 fill}
.mon.now{outline:3px solid var(--sun);outline-offset:1px}
.mon .sp{width:40px;height:34px;background-size:contain}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.keys>div{display:flex;flex-wrap:wrap;gap:6px 12px}
.keys>div:first-child{grid-column:1/-1}
.keys b{flex-basis:100%;font-weight:400;font-size:20px;color:var(--ink-soft)}
.key{display:inline-flex;align-items:center;gap:6px;font-size:20px}

dialog{padding:0;border:0;background:none;color:var(--ink);max-width:min(94vw,420px);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(6,20,32,.7)}
dialog .parch{padding:4px 6px}
dialog h2{margin:0 0 8px;font:400 34px/1 var(--pixel)}
dialog ol{margin:0 0 14px;padding-left:24px;font-size:22px;line-height:1.1}
dialog li{margin:8px 0}
#catch .parch{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px}
#catch .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<!--
THESIS: The sea is a window. You look down through clear water at a real seabed, and sun, shade and depth are light: caustics where the sun reaches, cloud shadow where it does not, a shelf where the water drops. Refuses the flat outlined grid board every daily puzzle ships.
OWN-WORLD: Rich pixel art lagoon on a deep-teal page; seabed tiles that run across squares; a beach and a wooden pier along the bottom where the cat sits with a rod; UI as pixel-drawn wood planks and parchment (9-slice), gold pixel buttons; Jersey 10 everywhere; one integer pixel grid.
STORY: The player reads the cat's line, looks into the water, taps a square to read its three habits, casts (the line arcs from the rod to a bobber), and deduces the fish in six casts; the catch takes the foreground as a pixel scene of the cat hauling the golden fish out of the water; then shares.
FIRST VIEWPORT: Wordmark, the cat's dialogue box, then the lagoon with the beach and pier in a wooden frame at an integer scale; the cast plaque with bobbers left and the gold Cast button right under it.
FORM: Água Clara, candidate 5 of 7 (rich pixel art seen from above), seed 9bbec2c1; owner steer: no island, the cat fishing from a pier, a foreground catch scene.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="wrap">
  <header class="top">
    <button class="icon-btn wood" id="help-btn" aria-label="Help"><i class="sp" id="help-icon"></i></button>
    <div><h1>Good <span>Catch</span></h1><div class="date" id="sub"></div></div>
    <button class="icon-btn wood" id="lang"></button>
  </header>
  <div class="talk"><i class="sp face" id="cat"></i><div class="bubble parch"><p id="say" aria-live="polite"></p><div class="feat" id="feat" hidden></div></div></div>
  <div class="sea" id="seabox"><canvas id="sea" aria-hidden="true"></canvas><div class="grid" id="board"></div><button id="hook" type="button" hidden><span id="hook-say"></span><span class="bar"><i class="zone" id="hook-zone"></i><i class="needle" id="hook-needle"></i></span></button></div>
  <div class="cast wood" id="bar">
    <div class="row"><div class="left" id="left"></div><button class="btn" id="cast"></button></div>
  </div>
  <section class="result parch" id="result" hidden></section>
  <section class="book parch" id="logbox" hidden><h2 id="log-title"></h2><ol class="log" id="log"></ol></section>
  <section class="book parch" id="journal"></section>
  <section class="book parch"><h2 id="key-title"></h2><div class="keys" id="legend"></div></section>
</div>
<dialog id="help"><div class="parch">
  <h2 id="help-title"></h2>
  <ol id="help-body"></ol>
  <form method="dialog"><button class="btn" id="got-it"></button></form>
</div></dialog>
<dialog id="catch"><div class="parch" id="catch-body"></div></dialog>
<dialog id="dex"><div class="parch"><div id="dex-body"></div><form method="dialog"><button class="btn" id="dex-close"></button></form></div></dialog>
<script>
(function(){
// @gen-start
const N=7, BOTTOMS=['areia','coral','pedra','alga'];
function seedFrom(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const key=(r,c)=>r*100+c;
const combo=x=>x.b*4+x.d*2+x.l;
const bites=(x,f)=>(x.b===f.b)+(x.d===f.d)+(x.l===f.l);
const stars=n=>n<=2?3:n===3?2:1;
// The beach runs along the bottom edge: a square is shallow from its column's shelf row down to the shore.
// Shade is the shadow of two clouds, a square's centre inside an ellipse.
function genSea(date){
  for(let tries=1;;tries++){
    const rng=mulberry(seedFrom(`${date}:pista${tries>1?':'+tries:''}`)), ri=n=>Math.floor(rng()*n);
    const shelf=[];let sh=3+ri(3);for(let c=0;c<N;c++){shelf.push(sh);sh=Math.min(5,Math.max(3,sh+ri(3)-1))}
    const clouds=Array.from({length:2},()=>({r:rng()*N,c:rng()*N,rr:1.2+rng()*1.3,rc:1.5+rng()*1.5}));
    const pts=Array.from({length:6},(_,i)=>({r:rng()*N,c:rng()*N,b:i<4?i:ri(4)}));
    const grid=[];
    for(let r=0;r<N;r++){grid.push([]);for(let c=0;c<N;c++){
      let b=0,bd=1e9;for(const p of pts){const q=(p.r-r-.5)**2+(p.c-c-.5)**2;if(q<bd){bd=q;b=p.b}}
      const l=clouds.some(k=>((r+.5-k.r)/k.rr)**2+((c+.5-k.c)/k.rc)**2<=1)?1:0;
      grid[r].push({b,d:r>=shelf[c]?0:1,l});
    }}
    const present=[...new Set(grid.flat().map(combo))].sort((x,y)=>x-y);
    if(present.length===12){const f=present[ri(12)];return {grid,shelf,clouds,fish:{b:f>>2,d:(f>>1)&1,l:f&1},present,tries}}
  }
}
const SHAPES={
  oval:["......aaaaa.....","....aaaaaaaaa.ff","..aaaaaaaaaaaaff",".aweaaaaaaaaafff","aaaaaaaaaaaaafff",".acccccccccaaaff","..ccccccccccaaff","....cccccca...ff","......ff........"],
  tall:["......ff......",".....fff......","....aaaa......","...aaaaaa.....","..aaaaaaaa..ff",".aweaaaaaaaaff","aaaaaaaaaaaaff",".aaaaaaaaaaaff","..cccccccc..ff","...cccccc.....","....cccc......",".....fff......","......ff......"],
  round:[".....aaaa.....","...aaaaaaaa...","..aaaaaaaaaa.f",".aweaaaaaaaaff","aaaaaaaaaaaaaf","aaaaaaaaaaaaff",".acccccccccaaf","..cccccccccc..","...cccccccc...",".....cccc....."],
  flat:["....aaaaaaaa....","..aaaaaaaaaaaa..",".aaewaaaaaaaaaff","aaaaaaaaaaaaaaff",".aaewaaaaaaaaaff","..aaaaaaaaaaaa..","....aaaaaaaa...."],
  long:["...aaaaaaaaaa.f.",".awaaaaaaaaaaaff","aeaaaaaaaaaaaaff",".acccccccccccaff","...cccccccccc.f."],
  seahorse:["...aaa...","..aaaaf..",".aewaaf..","aaa.aa...","....aaa..","...aaaaf.","...acaaf.","...acaa..","...acaa..","....aaa..",".....aa..","...a.aa..","...aa.a..","....aa..."],
  ray:[".......aa.......","......aaaa......",".....aaaaaa.....","a...aaaaaaaa...a","aaaaaaaaaaaaaaaa",".aaaaawaawaaaaa.","..aaaaeaaeaaaa..","...aaaaaaaaaa...",".....aaaaaa.....",".......ff.......",".......ff.......","........f......."],
};
// rare: 1 uncommon, 2 rare (Saturdays only). Species is flavour and collection; it never changes the habits.
const SPECIES=[
  {id:'dourado',shape:'oval',pal:{a:'#F2C84B',b:'#C9962E',c:'#FFE9A0',f:'#E0A030'},spots:[[2,6],[4,9]]},
  {id:'palhaco',shape:'oval',pal:{a:'#F28A30',b:'#FFFFFF',c:'#F9A850',f:'#1A1A1A'},stripes:[3,8,12]},
  {id:'cirurgiao',shape:'oval',pal:{a:'#3E6FD8',b:'#14285A',c:'#2F58B8',f:'#F2C84B'},spots:[[2,6],[2,7],[2,8],[3,9],[3,10]]},
  {id:'garoupa',shape:'oval',pal:{a:'#A0744A',b:'#5E3A1A',c:'#C9A070',f:'#7A5230'},spots:[[2,5],[3,9],[4,3],[5,7],[2,11],[4,12]]},
  {id:'baiacu',shape:'round',pal:{a:'#D9B460',b:'#6B4A2A',c:'#F4E6BE',f:'#C79A40'},spots:[[1,5],[2,8],[3,11],[4,6],[2,3]]},
  {id:'papagaio',shape:'oval',pal:{a:'#3FBF8F',b:'#F2A0C8',c:'#7FE0B8',f:'#2E8F6A'},stripes:[5,10]},
  {id:'linguado',shape:'flat',pal:{a:'#C9A56A',b:'#8A6A40',f:'#A8844E'},spots:[[1,6],[3,9],[5,4],[5,11],[1,12]]},
  {id:'sardinha',shape:'long',pal:{a:'#8FB8D8',b:'#4E7FA8',c:'#E4EEF4',f:'#6E98BA'},spots:[[0,4],[0,6],[0,8]]},
  {id:'anjo',shape:'tall',rare:1,pal:{a:'#F2D24B',b:'#1A1A2A',c:'#FFE88A',f:'#3E6FD8'},stripes:[5,9]},
  {id:'cavalo',shape:'seahorse',rare:1,pal:{a:'#F28A30',b:'#B24E22',c:'#FFC07A',f:'#FFD08A'},spots:[[4,5],[9,5]]},
  {id:'leao',shape:'tall',rare:2,pal:{a:'#D8553A',b:'#FFFFFF',c:'#F4D8C8',f:'#E89080'},stripes:[3,6,9]},
  {id:'manta',shape:'ray',rare:2,pal:{a:'#2A4A7A',b:'#1A2E50',f:'#2A4A7A'},spots:[[3,7],[3,8],[4,3],[4,12]]},
];
function speciesMap(s){
  const m=SHAPES[s.shape].map(r=>[...r]);
  for(const c of s.stripes||[])for(const row of m)if(/[ac]/.test(row[c]||''))row[c]='b';
  for(const[r,c]of s.spots||[])if(/[ac]/.test(m[r]?.[c]||''))m[r][c]='b';
  return m.map(r=>r.join(''));
}
// Weekdays and Sunday draw from a per-week shuffle of the ten common species, so a week never repeats; Saturday is rare.

  const room=innerHeight-(box.getBoundingClientRect().top+scrollY)-20-($('bar').offsetHeight||64)-8;
  const W=GW*2, H=GH*2, k=Math.max(Math.ceil(200*dpr/W),Math.min(Math.floor(avail*dpr/W),Math.floor(room*dpr/H)));
  view.width=W*k; view.height=H*k; view.style.width=W*k/dpr+'px'; view.style.height=H*k/dpr+'px';
  $('board').style.height=W*k/dpr+'px';
}
function drawSea(now){
  const tk=Math.floor(now/125);
  if(tk!==q){q=tk;const b=bases[(tk>>3)&1];lit=new ImageData(new Uint8ClampedArray(b.data),GW*2,GW*2);lightUp(lit,SEA.grid,tk*.25,2)}
  // The 1x canvas only carries what moves over the water (sparkles, line, rings, splash); it is doubled onto the 2x floor.
  wx.clearRect(0,0,GW,GH); surface(wx,SEA.grid,tk);
  const done=over(), won=caught();
  const lastK=casts.at(-1);
  if(lastK!==undefined){const p=anim&&anim.k===lastK?Math.min(1,(now-anim.start)/LAND):1;lineTo(wx,centre(lastK),p)}
  if(anim){const age=now-anim.start-LAND,c=centre(anim.k);if(age>=0&&age<800)ring(wx,c,3+age/60,1-age/800);if(anim.n===3&&age>=0&&age<1300)splash(wx,c,age)}
  w2.imageSmoothingEnabled=false; w2.putImageData(lit,0,0); beach(w2,tk,2); w2.drawImage(work,0,0,GW*2,GH*2); pier2(w2);
  casts.forEach((k,i)=>{
    if(bitesAt(k)===3||(anim&&anim.k===k&&now-anim.start<LAND)) return;
    const c=centre(k); art(w2,'ui/bobber',c.x*2-8,c.y*2-12+(((tk>>1)+i)%3===0?2:0));
  });
  const fishImg=IMG['fish/'+TODAY.id], fishAt=(c,hop)=>art(w2,'fish/'+TODAY.id,c.x*2-(fishImg.width>>1),c.y*2-(fishImg.height>>1)-hop*2);
  if(won&&!hook){const k=casts.find(k=>bitesAt(k)===3),c=centre(k),age=anim&&anim.k===k?now-anim.start-LAND:1e4;
    if(age>=0)fishAt(c,age<900?Math.round(Math.sin(age/900*Math.PI)*14):0)}
  if(done&&!won)fishCells().forEach(k=>fishAt(centre(k),0));
  vx.imageSmoothingEnabled=false; vx.drawImage(work2,0,0,view.width,view.height);
  document.querySelectorAll('canvas.scene').forEach(cv=>{
    const sx=cv.getContext('2d'), fi=cv.dataset.live?Math.floor((now-sceneAt)/70):40;
    const small=cv._s||(cv._s=canvas(80,64)), big=cv._b||(cv._b=canvas(160,128)), bx=big.getContext('2d');
    const fish=scene(small.getContext('2d'),caught(),fi,tk);
    bx.imageSmoothingEnabled=false; bx.drawImage(small,0,0,160,128);
    if(fish) art(bx,'portrait/'+TODAY.id,fish.x*2,fish.y*2,true);
    sx.imageSmoothingEnabled=false; sx.drawImage(big,0,0,cv.width,cv.height);
  });
}
function fitScene(cv,avail){const dpr=devicePixelRatio||1,k=Math.max(1,Math.floor(avail*dpr/160));cv.width=160*k;cv.height=128*k;cv.style.width=160*k/dpr+'px';cv.style.height=128*k/dpr+'px'}
const still=matchMedia('(prefers-reduced-motion: reduce)');
function loop(now){drawSea(now);if(!still.matches)requestAnimationFrame(loop)}

function tileURL(cell,light){
  const cv=paintSeabed([[cell]],0),x=cv.getContext('2d');
  if(light){const img=x.getImageData(0,0,S,S);lightUp(img,[[cell]],2);x.putImageData(img,0,0)}
  const out=canvas(16,16);out.getContext('2d').drawImage(cv,4,4,16,16,0,0,16,16);return out.toDataURL();
}
const TILE={b0:tileURL({b:0,d:0}),b1:tileURL({b:1,d:0}),b2:tileURL({b:2,d:0}),b3:tileURL({b:3,d:0}),
  d0:tileURL({d:0}),d1:tileURL({d:1}),l0:tileURL({d:0,l:0},true),l1:tileURL({d:0,l:1})};
const chip=(k,cls='chip')=>`<span class="${cls}"><img alt="" src="${TILE[k]}">${t(k)}</span>`;
const starsHTML=st=>`<div class="stars" role="img" aria-label="${st}/3">${[0,1,2].map(i=>sprite(i<st?'star':'starOff')).join('')}</div>`;
// The village: everyone's results for the day, from the API. The game never waits on it; any failure just hides it.
const API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8787':'https://goodcatch-api.goodcatch-api.workers.dev';
let VILLAGE=null, heatOn=false;
const playerId=()=>{try{let id=localStorage.getItem('goodcatch:player');if(!id){id=crypto.randomUUID();localStorage.setItem('goodcatch:player',id)}return id}catch(e){return null}};
// Posting is idempotent server-side (first game of the day stands), so a finished day is sent on every visit.
function sendPlay(){
  const id=playerId(); if(!API||!id||!over()) return;
  fetch(`${API}/plays`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:DATE,player:id,casts})})
    .then(r=>r.ok?r.json():null).then(v=>{if(!v)return;const q=qOn(DATE);if(q!==null&&v.you&&v.you.won&&v.you.q===null)sendSize(q);VILLAGE=v;render();if($('catch').open){$('catch-body').innerHTML=resultHTML(true);wireResult($('catch-body'))}}).catch(()=>{});
}
function sendSize(q){
  const id=playerId(); if(!API||!id) return;
  fetch(`${API}/plays/size`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:DATE,player:id,q})})
    .then(r=>r.ok?r.json():null).then(v=>{if(!v)return;VILLAGE=v;render();if($('catch').open){$('catch-body').innerHTML=resultHTML(true);wireResult($('catch-body'))}}).catch(()=>{});
}
// With few players a percentage says little and "better than 0%" stings, so small days show a rank.
function standing(v,mine){
  if(v.players===1) return t('first_only');
  const rank=1+v.dist.slice(0,mine).reduce((a,b)=>a+b,0);
  return v.players<10||!v.better?t('rank',{r:rank,n:v.players}):`${t('village',{n:v.players})} · ${t('better',{p:v.better})}`;
}
function villageHTML(){
  const v=VILLAGE; if(!v||!v.players) return '';
  const max=Math.max(...v.dist,1), mine=v.you?(v.you.won?v.you.n-1:6):-1;
  return `<div class="vila"><div class="vila-head"><b>${t('village_title')}</b>${v.heat?`<button class="btn small" data-heat>${t(heatOn?'heat_off':'heat_on')}</button>`:''}</div>`
    +(mine>=0?`<p class="rank">${standing(v,mine)}</p>`:`<p class="rank">${t(v.players===1?'village1':'village',{n:v.players})}</p>`)
    +(v.size&&v.size.top!==null&&caught()?`<p class="rank">${t('size_top',{cm:cmOf(v.size.top,CM[TODAY.id])})}${v.size.n>=9&&v.size.better>0?` · ${t('size_better',{p:v.size.better})}`:''}</p>`:'')
    +(v.streak&&v.players>=10&&v.streak.better>0?`<p class="rank">${t('streak_better',{p:v.streak.better})}</p>`:'')
    +`<div class="bars">${v.dist.map((c,i)=>`<span class="${i===mine?'me':''}"><b>${i<6?i+1:'✕'}</b>${c?`<i style="width:${Math.round(100*c/max)}%">${c}</i>`:'<i class="zero"></i>'}</span>`).join('')}</div></div>`;
}
function resultHTML(live){
  const won=caught(), st=won?stars(casts.length):0;
  const q=qOn(DATE), tier=tierOn(DATE), g=guestOf(DATE);
  const sunday=new Date(DATE+'T12:00:00').getDay()===0, filled=weekOf(DATE).filter(caughtOn).length, vw=VILLAGE?.week, wc=vw?vw.reduce((a,w)=>a+w.caught,0):0;
  return `<canvas class="scene"${live?' data-live="1"':''} aria-hidden="true"></canvas>`
    +`<div class="score"><div class="big${won?'':' lost'}">${won?casts.length:'X'}/${MAX}</div><div class="side">${won?starsHTML(st):''}<p class="verdict">${t(won?'won_title':'lost_title')} ${t('tomorrow')}</p></div></div>`
    +(won&&q!==null?`<p class="verdict">${t('size',{cm:cmOf(q,CM[TODAY.id]),t:t('tier_'+tierOf(q))})}</p>`:'')
    +(tier?`<p class="guest-say">${guestSprite(g)}<span>${t(`g_${g}_${tier}`)}</span></p>`:'')
    +(sunday?`<canvas class="banquet" aria-hidden="true"></canvas><p class="verdict">${t(filled>=6?'feast2':filled>=3?'feast1':'feast0')}${vw?' '+t(wc===1?'feast_village1':'feast_village',{n:wc}):''}</p>`:'')
    +villageHTML()+weekHTML()
    +`<div class="actions"><button class="btn" data-share>${t('share')}</button>${live?`<form method="dialog"><button class="btn">${t('see_sea')}</button></form>`:''}</div><p class="note"></p>`;
}
function wireResult(el){
  el.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{share(el.querySelector('.note'));track('share',true)});
  el.querySelectorAll('[data-heat]').forEach(b=>b.onclick=()=>{heatOn=!heatOn;sel=null;if($('catch').open)$('catch').close();render();if(heatOn)$('seabox').scrollIntoView({behavior:'smooth',block:'center'})});
  const cv=el.querySelector('canvas.scene'); if(cv) fitScene(cv,Math.min(el.clientWidth||340,400)-8);
  const bq=el.querySelector('canvas.banquet');
  if(bq){fitScene(bq,Math.min(el.clientWidth||340,400)-8);const draw=()=>{const s=canvas(80,64),b=canvas(160,128),bx=b.getContext('2d'),q=bq.getContext('2d');banquet(s.getContext('2d'));bx.imageSmoothingEnabled=false;bx.drawImage(s,0,0,160,128);banquet2(bx);q.imageSmoothingEnabled=false;q.drawImage(b,0,0,bq.width,bq.height)};draw();ART_READY.then(draw)}
}

function renderStatic(){
  document.documentElement.lang=LANG;
  $('sub').textContent=t('sub',{n:DAYNUM,d:DATE});
  $('lang').textContent=t('lang'); $('help-btn').setAttribute('aria-label',t('help'));
  $('help-title').textContent=t('help_title'); $('got-it').textContent=t('got_it');
  $('help-body').innerHTML=['help1','help2','help3'].map(k=>`<li>${t(k)}</li>`).join('');
  $('log-title').textContent=t('log_title'); $('dex-close').textContent=t('close'); $('key-title').textContent=t('key_title');
  $('legend').innerHTML=[['cat_b',['b0','b1','b2','b3']],['cat_d',['d0','d1']],['cat_l',['l0','l1']]]
    .map(([h,ks])=>`<div><b>${t(h)}</b>${ks.map(k=>chip(k,'key')).join('')}</div>`).join('');
}
function render(){
  const done=over(), won=caught(), busy=!!anim||!!hook, fc=combo(SEA.fish);
  const heat=heatOn&&VILLAGE?.heat, hmax=heat?Math.max(1,...Object.values(heat)):1, heatAt=k=>heat[k]||0;
  $('board').innerHTML=SEA.grid.map((row,r)=>row.map((x,c)=>{
    const k=key(r,c), i=casts.indexOf(k), n=i<0?null:bitesAt(k), reveal=done&&!won&&combo(x)===fc;
    const cls=['c',k===sel&&'sel',reveal&&'win'].filter(Boolean).join(' ');
    const label=feats(x).join(', ')+(n===null?'':` · ${n}`)+(heat?` · ${t('heat_cell',{n:heatAt(k),t:VILLAGE.players})}`:'');
    const tag=n!==null&&!(anim&&anim.k===k)?`<b class="tag${n===3?' hit':''}">${n}</b>`:'';
    const tint=heat?`<i class="heat" style="--a:${(.85*Math.sqrt(heatAt(k)/hmax)).toFixed(2)}"></i>`:'';
    return `<button class="${cls}" data-k="${k}"${heat?(busy?' disabled':''):done||busy||i>=0?' disabled':''} aria-label="${label}">${tint}${tag}</button>`;
  }).join('')).join('');
  const lastN=casts.length&&!busy?bitesAt(casts.at(-1)):null;
  $('say').textContent=heat?(sel!==null?t('heat_cell',{n:heatAt(sel),t:VILLAGE.players}):VILLAGE.players===1?t('heat_say1'):t('heat_say',{n:VILLAGE.players}))
    :done&&!busy?(won?t('caught',spVars(TODAY.id,{n:casts.length})):t('lost',spVars(TODAY.id,{h:feats(SEA.fish).join(', ')}))):lastN!==null?t('bite'+lastN):t(casts.length?'bite'+bitesAt(casts.at(-1)):'intro',spVars(TODAY.id));
  $('bar').hidden=done&&!busy;
  const sx=sel===null?null:cellAt(sel);
  $('feat').innerHTML=sx?['b'+sx.b,'d'+sx.d,'l'+sx.l].map(k=>chip(k)).join(''):''; $('feat').hidden=!sx; $('say').hidden=!!sx&&!heat;
  $('cat').style.backgroundImage=`url(${ART['portrait/'+(won&&!busy?'catHappy':'catFace')]})`;
  $('left').innerHTML=Array.from({length:MAX},(_,i)=>sprite('bobber',i<casts.length?'used':'')).join('');
  $('left').setAttribute('aria-label',t('left',{n:MAX-casts.length})); $('left').setAttribute('role','img');
  $('cast').textContent=t('cast'); $('cast').disabled=sel===null||busy;
  $('logbox').hidden=!casts.length;
  $('journal').innerHTML=todayHTML();
  $('open-dex').onclick=()=>{$('dex-body').innerHTML=journalHTML();$('dex').showModal()};
  $('log').innerHTML=casts.map((k,i)=>[k,i]).reverse().map(([k,i])=>{const n=bitesAt(k);return `<li><span>${i+1}</span><span>${feats(cellAt(k)).join(' · ')}</span><span class="pips" role="img" aria-label="${n}/3">${[0,1,2].map(j=>j<n?fishSprite(TODAY.id):'<i class="off"></i>').join('')}</span></li>`}).join('');
  $('result').hidden=!done||busy;
  if(done&&!busy){$('result').innerHTML=resultHTML(false);wireResult($('result'))}
}
function shareText(){
  const won=caught(), st=won?stars(casts.length):0, q=qOn(DATE), range=CM[TODAY.id];
  const fire=streakOf();
  return `🎣 Good Catch #${DAYNUM}  ${won?casts.length:'X'}/${MAX}${won?' '+'★'.repeat(st)+'☆'.repeat(3-st):''}${fire>1?` 🔥${fire}`:''}\n`
    +(won&&q!==null?`📏 ${cmOf(q,range)}/${range[1]} cm\n`:'')
    +casts.map(k=>fishes(bitesAt(k))).join('\n')+'\ngoodcatch.fish';
}
function share(note){
  const txt=shareText();
  const fail=()=>{note.textContent=t('copy_fail')+txt.replace(/\n/g,' · ')};
  const copy=()=>{try{navigator.clipboard.writeText(txt).then(()=>{note.textContent=t('copied')},fail)}catch(e){fail()}};
  if(navigator.share&&matchMedia('(pointer:coarse)').matches) navigator.share({text:txt}).catch(e=>{if(e.name!=='AbortError')copy()});
  else copy();
}
function showCatch(){
  $('catch-body').innerHTML=resultHTML(true); $('catch').showModal(); sceneAt=performance.now(); wireResult($('catch-body'));
  if(still.matches) drawSea(performance.now()+5000);
}
// The score is already final here (sendPlay ran); the tap only sizes the fish, and a miss still lands it.
function startHook(){
  const b=$('hook'),centre=zoneOf(DATE),period=still.matches?760:380;
  hook={t0:null,centre,x:50};
  $('hook-zone').style.left=`${centre-ZONE_W/2}%`; $('hook-zone').style.width=`${ZONE_W}%`;
  $('hook-say').textContent=t('hook'); b.setAttribute('aria-label',t('hook_aria')); b.hidden=false; b.focus();
  render(); if(still.matches) drawSea(performance.now());
  const tick=now=>{
    if(!hook) return;
    hook.t0??=now;
    hook.x=50+50*Math.sin((now-hook.t0)/period);
    $('hook-needle').style.left=`${hook.x}%`;
    if(now-hook.t0>HOOK_MS) return endHook(20);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function endHook(q){
  if(!hook) return;
  hook=null; $('hook').hidden=true;
  try{localStorage.setItem(QK,String(q))}catch(e){}
  sendSize(q);
  anim={k:casts.at(-1),start:performance.now()-LAND,n:3}; render();
  setTimeout(()=>{anim=null;render();showCatch();if(still.matches)drawSea(performance.now())},still.matches?0:1100);
}
// The 4 s only run while the bar is on screen: a tab in the background must not post a q nobody saw.
document.addEventListener('visibilitychange',()=>{if(hook)hook.t0=null});
// Read on press: the needle keeps moving until release. Keyboard still lands through click; endHook ignores the second call.
const tapHook=e=>{if(!hook)return;e.preventDefault();endHook(qOf(hook.x,hook.centre))};
$('hook').onpointerdown=tapHook; $('hook').onclick=tapHook;


$('help-icon').style.backgroundImage=`url(${URLS.help})`;
$('board').addEventListener('click',e=>{
  const b=e.target.closest('.c'); if(!b||b.disabled) return;
  const k=Number(b.dataset.k); sel=sel===k?null:k; render();
});
$('cast').onclick=()=>{
  if(sel===null||over()||anim) return;
  const k=sel; casts.push(k); sel=null;
  try{localStorage.setItem(REC,JSON.stringify(casts))}catch(e){}
  anim={k,start:performance.now(),n:bitesAt(k)};
  if(casts.length===1){track(`pista/day-${Math.min(playedDays().length,30)}`,true);track(`pista/streak-${Math.min(streakOf(),30)}`,true)}
  if(over()){track(caught()?`pista/caught-${casts.length}`:'pista/lost',true);sendPlay()}
  render();
  const end=over(), won=caught();
  setTimeout(()=>{anim=null;if(won){startHook();return}render();if(end)showCatch();if(still.matches)drawSea(performance.now())},still.matches?0:won?LAND:LAND+500);
  if(still.matches) drawSea(performance.now()+LAND);
};
$('lang').onclick=()=>{LANG=LANG==='en'?'pt':'en';try{localStorage.setItem('goodcatch:lang',LANG)}catch(e){}renderStatic();render();if($('catch').open){$('catch-body').innerHTML=resultHTML(true);wireResult($('catch-body'))}};
$('help-btn').onclick=()=>$('help').showModal();
// Mobile browsers resize while their toolbars slide; refit only when the width really changes.
let fitW=innerWidth;addEventListener('resize',()=>{if(innerWidth===fitW)return;fitW=innerWidth;fit();drawSea(performance.now())});
renderStatic(); render(); fit(); drawSea(performance.now()); ART_READY.then(()=>drawSea(performance.now())); if(!still.matches) requestAnimationFrame(loop); sendPlay();
if(caught()&&qOn(DATE)===null) startHook();
// The pixel font changes the bubble's height once it loads, and the board's scale depends on that height.
document.fonts?.ready.then(()=>{fit();drawSea(performance.now())});
track(location.pathname);
let seen=null;try{seen=localStorage.getItem('goodcatch:pista:seenHelp')}catch(e){}
if(!seen){$('help').showModal();try{localStorage.setItem('goodcatch:pista:seenHelp','1')}catch(e){}}
})();
</script>
