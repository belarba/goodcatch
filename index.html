<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily fishing puzzle. Go for the best catch, or the worst.">
<title>Good Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Jersey+10&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#E4F4F2; --surface:#FFFFFF; --surface2:#EEF7F6; --edge:#5F8A92;
  --ink:#10324A; --muted:#48656F; --accent:#F08A24; --accent-text:#A04C08; --sand:#E8C77E;
  --good:#157A4C; --bad:#C8352A;
  --water:#9EDFE4; --pen:#F7E6B0; --protect:#9E2419;
  --pixel:"Jersey 10",ui-rounded,system-ui,sans-serif;
  --body:Figtree,system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
::selection{background:var(--pen);color:var(--ink)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px}

.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.icon-btn{appearance:none;width:40px;height:40px;border:2px solid var(--ink);background:var(--surface);border-radius:10px;font:400 28px var(--pixel);color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--pen)}
h1{font:400 clamp(36px,10vw,44px)/1 var(--pixel);margin:0}
h1 span{color:var(--accent-text)}
.date{font:400 18px var(--pixel);color:var(--muted);margin-top:2px}

.menu{margin:0;inset:auto;top:60px;right:max(16px,calc(50vw - 254px));position:fixed;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 8px 24px rgba(16,50,74,.18)}
.menu button{display:block;width:100%;appearance:none;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--surface2)}

.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.switch button{appearance:none;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:400 22px/1 var(--pixel);padding:6px;border-radius:12px;cursor:pointer;display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:7px;min-height:52px;white-space:nowrap}
.switch button:hover{background:var(--surface2)}
.switch button:nth-child(3){grid-column:1/-1}
.switch button .sp{grid-row:span 2}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--ink)}
.switch .sp{width:28px;height:28px}
.switch small{font-size:18px;color:var(--good);text-align:left}
.switch button[aria-selected="true"] small{color:var(--ink)}
.switch small:empty{display:none}
.switch button:has(small:empty) .sp{grid-row:auto}

.game{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;display:flex;justify-content:center}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);
  aspect-ratio:var(--cols)/var(--rows);width:min(100%, max(260px, calc(var(--cols) / var(--rows) * (100svh - 360px))));
  touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;background:var(--water) center/100% 100%;
  box-shadow:0 0 0 3px var(--ink);image-rendering:pixelated;cursor:crosshair}
.board.line{border-bottom:8px solid var(--sand)}
.c{position:relative;display:grid;place-items:center}
.c.in{background:var(--pen);animation:sweep .45s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--since,0s) + var(--d,0)*45ms)}
.ov .rope{animation:ropein .35s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--since,0s) + var(--d,0)*45ms + 120ms)}
@keyframes sweep{from{background-color:rgba(247,230,176,0)}}
@keyframes ropein{from{opacity:0}}
.board.started .c.boat::after{animation:none;opacity:0}
.c.rock .s-rock{width:100%;height:100%}
.board.spot .c.rock:not(.lit) .sp.s-rock{opacity:1}
.sp{display:block;width:var(--spx,28px);height:var(--spx,28px);background:center/100% no-repeat;image-rendering:pixelated;position:relative;z-index:1;pointer-events:none}
.c.neg.hit::after{display:none}
.c.neg::after{content:"";position:absolute;inset:8%;z-index:0;border:2px dashed var(--protect);border-radius:6px;background:rgba(158,36,25,.07)}
.c.hit::before{content:"";position:absolute;inset:6%;border-radius:6px;border:3px solid var(--bad)}
.c.hit.good::before{border-color:var(--good);background:rgba(21,122,76,.14)}
.c.hit.bad::before{border-color:var(--bad);background:rgba(200,53,42,.16)}
.c.gone .sp{opacity:.3}
.c>.s-buoy{position:absolute;inset:0;margin:auto;z-index:2;opacity:1!important}
.board.spot .c:not(.lit) .sp:not(.s-boat){opacity:.25}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

.panel{position:absolute;inset:0 0 auto;margin:0 auto;width:min(100%,420px);min-height:100%;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center;z-index:3;box-shadow:0 10px 30px rgba(16,50,74,.2)}
.big{font:400 72px/1 var(--pixel)}
.big.good,.good b,.pos{color:var(--good)} .big.bad,.bad b,.neg-t{color:var(--bad)} .big.zero{color:var(--muted)}
.verdict{font:400 28px var(--pixel)}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 22px var(--pixel);color:var(--muted)}
.chips span{display:inline-flex;align-items:center;gap:3px}
.chips .sp{width:28px;height:28px}
.big-good{color:var(--good)} .big-bad{color:var(--bad)} .big-zero{color:var(--muted)}
.range{display:flex;flex-direction:column;gap:4px}
.range-label{font-size:13px;color:var(--muted)}
.bar{position:relative;height:10px;background:var(--surface2);border:1px solid var(--edge);border-radius:6px}
.bar i{position:absolute;top:0;bottom:0;min-width:4px;background:linear-gradient(90deg,var(--bad),var(--good));border-radius:6px}
.range-ends{display:flex;justify-content:space-between;font:400 18px var(--pixel)}
.range-note{margin:0;font-size:13px;color:var(--accent-text)}
.recs{font:400 22px var(--pixel);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}

.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 22px var(--pixel)}
.meta .count b{font-weight:500}
.meta .pv{color:var(--muted)} .meta .pv b{color:var(--ink)}
.badge{font:400 18px var(--pixel);color:var(--ink);background:var(--pen);border:2px solid var(--ink);padding:0 7px;border-radius:6px}
.hint{margin:0;min-height:1.5em;font-size:15px;color:var(--muted);text-align:center}
.hint.alert{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 4px 2px}
.card{appearance:none;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:5px 5px 7px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;cursor:pointer;font:inherit;box-shadow:0 3px 8px rgba(16,50,74,.14);transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s,opacity .25s}
.card:nth-child(1){transform:rotate(-3deg)} .card:nth-child(3){transform:rotate(3deg)}
.card:hover{transform:translateY(-3px) rotate(0)}
.card .art{position:relative;display:grid;place-items:center;height:46px;border-radius:6px;background:var(--water);border:1.5px solid var(--ink)}
.card.limit .art{background:var(--pen)}
.card .art .sp{width:28px;height:28px}
.card .rank{position:absolute;top:1px;left:5px;font:400 18px/1 var(--pixel)}
.card b{font:400 18px/1 var(--pixel);margin-top:2px}
.card .rule{font-size:13px;line-height:1.25;color:var(--muted)}
.cards.picked .card:not([aria-pressed="true"]){border-color:var(--edge);box-shadow:none}
.cards.picked .card:not([aria-pressed="true"]) .art{opacity:.5}
.card[aria-pressed="true"]{transform:translateY(-6px) rotate(0);border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent),0 10px 18px rgba(16,50,74,.22)}
.card[aria-pressed="true"] .rule{color:var(--ink)}
.sp.arr{display:inline-block;width:.75em;height:.75em;vertical-align:-.05em;margin-right:1px}
.icon-btn .sp{width:24px;height:24px;margin:auto}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.mark{position:absolute;pointer-events:none;z-index:4;display:grid;place-items:center;font:400 22px var(--pixel)}
.hook{position:absolute;pointer-events:none;z-index:4;width:2px;background:var(--ink);transform:translateX(-1px)}
.mark.blocked{border:3px solid var(--bad);border-radius:6px;animation:shake .35s ease-in-out,fade .6s .35s forwards}
.bubble{position:absolute;z-index:5;max-width:78%;padding:6px 10px;background:var(--surface);color:var(--ink);font:400 18px/1.1 var(--pixel);text-align:center;border:2px solid var(--ink);border-radius:10px;box-shadow:0 4px 12px rgba(16,50,74,.22);pointer-events:none;animation:pop .18s ease-out,fade .4s 2.5s forwards}
.bubble::before,.bubble::after{content:"";position:absolute;left:var(--tail);border:solid transparent}
.bubble::before{top:100%;margin-left:-9px;border-width:9px;border-top-color:var(--ink)}
.bubble::after{top:100%;margin-left:-6px;border-width:6px;border-top-color:var(--surface)}
.bubble.below::before,.bubble.below::after{top:auto;bottom:100%;border-top-color:transparent}
.bubble.below::before{border-bottom-color:var(--ink)}
.bubble.below::after{border-bottom-color:var(--surface)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.mark.cost{color:var(--bad);text-shadow:0 1px 4px rgba(255,255,255,.95);animation:rise .8s ease-out forwards}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fade{to{opacity:0}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-70%);opacity:0}}
@keyframes frames{0%{background-position:0 0}50%{background-position:100% 0}}
.c.boat{background:radial-gradient(circle,rgba(255,255,255,.75) 0 42%,transparent 72%)}
.c.boat::after{content:"";position:absolute;inset:4%;border:2px solid var(--accent);border-radius:50%;animation:ping 1.6s ease-out infinite;animation-delay:var(--clock,0s)}
@keyframes ping{from{transform:scale(.55);opacity:.9}to{transform:scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.mark{animation:fade .6s forwards!important}.sp,.c.boat::after,.c.in,.ov .rope{animation:none!important}.bubble{animation:fade .01s 2.5s forwards!important}}

.controls{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.panel .controls{grid-template-columns:1fr 1fr}
.game.done>.meta,.game.done>.hint,.game.done>.controls{visibility:hidden}
.btn{appearance:none;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:400 22px var(--pixel);padding:10px 12px;border-radius:12px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:disabled{border-color:var(--edge);color:var(--edge);background:transparent;cursor:default}
.reveal{display:flex;gap:8px}
.reveal .btn{flex:1;font-size:18px;padding:6px 8px}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#F79B40}
.btn.primary:disabled{background:transparent;color:var(--edge);border-color:var(--edge)}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center;min-height:1.2em}

.legend{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:6px 4px;margin-top:4px}
.legend button{appearance:none;border:0;background:transparent;border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:400 18px var(--pixel)}
.legend button:hover{background:var(--surface2)}
.legend button[aria-pressed="true"]{background:var(--pen)}
.legend .sp{width:28px;height:28px}
.legend .pos,.legend .neg-t{line-height:1}

dialog{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:20px;max-width:min(92vw,460px)}
dialog::backdrop{background:rgba(16,50,74,.45)}
dialog h2{font:400 28px var(--pixel);margin:0 0 8px}
dialog h3{font:400 22px var(--pixel);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
dialog h3 .sp{width:28px;height:28px}
dialog p{margin:0 0 6px;color:var(--muted)} dialog b{color:var(--ink)}
dialog .btn{width:100%;margin-top:14px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<!--
THESIS: the daylight daily-puzzle board of the category, done with care; the net's first rule (rock fences) is the loudest thing on screen. Refuses the dark teal game grid it replaces.
OWN-WORLD: seafoam page, white surfaces, navy ink outlines; flat turquoise water with a faint grid and a deeper wavy ring for open sea; rocks as Mario-style pixel blocks; sand pen swept in from the boat with a navy rope on its true perimeter; white buoys with a navy band; dashed protected-area square on protected animals; rule cards as playing cards; 12x12 pixel sprites kept as the fun.
STORY: the player reads the fence in a glance, closes a pen, sees exactly what it holds, hauls.
FIRST VIEWPORT: title, game switcher, (practice: three rule cards), the board full width, buoys left and catch, controls, legend.
FORM: canon (category standard), bar set by enclose.horse and Puzzmo; seed d74d21b0.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<div class="wrap">
  <header class="top">
    <button class="icon-btn" id="help-btn" data-t-label="how_to_play">?</button>
    <div><h1>Good <span>Catch</span></h1><div class="date" id="date"></div></div>
    <button class="icon-btn" id="menu-btn" popovertarget="menu" data-t-label="menu"><i class="sp s-menu"></i></button>
  </header>
  <div id="menu" class="menu" popover>
    <button id="train-btn"></button>
    <button id="tourney-btn"></button>
    <button id="lang-btn"></button>
  </div>

  <nav class="switch" role="tablist">
    <button role="tab" id="tab-rede"><i class="sp s-sardinha"></i><span data-t="game_rede"></span><small data-k="best"></small></button>
    <button role="tab" id="tab-linha"><i class="sp s-hook"></i><span data-t="game_linha"></span><small data-k="best"></small></button>
    <button role="tab" id="tab-fundo"><i class="sp s-hook"></i><span data-t="game_fundo"></span><small data-k="best"></small></button>
  </nav>

  <section class="game" id="game-rede">
    <div class="cards" data-k="card" hidden></div>
    <div class="stage"><div class="board net" data-k="board"></div><div class="panel" data-k="result" hidden></div></div>
    <div class="meta"><span class="count" data-k="count"></span><span class="badge" data-k="train" data-t="practice" hidden></span><span class="pv" data-k="pv"></span></div>
    <p class="hint" data-k="hint" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" data-k="undo" data-t="undo"></button>
      <button class="btn" data-k="clear" data-t="clear"></button>
      <button class="btn primary" data-k="go" data-t="go_rede"></button>
    </div>
  </section>

  <section class="game" id="game-linha" hidden>
    <div class="stage"><div class="board line" data-k="board"></div><div class="panel" data-k="result" hidden></div></div>
    <div class="meta"><span class="count" data-k="count"></span><span class="badge" data-k="train" data-t="practice" hidden></span><span class="pv" data-k="pv"></span></div>
    <p class="hint" data-k="hint" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" data-k="undo" data-t="undo"></button>
      <button class="btn" data-k="clear" data-t="clear"></button>
      <button class="btn primary" data-k="go" data-t="go_linha"></button>
    </div>
  </section>

  <section class="game" id="game-fundo" hidden>
    <div class="stage"><div class="board line" data-k="board"></div><div class="panel" data-k="result" hidden></div></div>
    <div class="meta"><span class="count" data-k="count"></span><span class="badge" data-k="train" data-t="practice" hidden></span><span class="pv" data-k="pv"></span></div>
    <p class="hint" data-k="hint" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" data-k="undo" data-t="undo"></button>
      <button class="btn" data-k="clear" data-t="clear"></button>
      <button class="btn primary" data-k="go" data-t="go_linha"></button>
    </div>
  </section>

  <div class="legend" id="legend"></div>
</div>

<dialog id="reveal">
  <p data-t="reveal_confirm"></p>
  <form method="dialog" class="choice">
    <button class="btn" value="no" data-t="cancel"></button>
    <button class="btn primary" value="yes" data-t="reveal_go"></button>
  </form>
</dialog>

<dialog id="help">
  <h2 data-t="how_to_play"></h2>
  <div id="help-body"></div>
  <form method="dialog"><button class="btn primary" data-t="got_it"></button></form>
</dialog>

function shift(m,[r0,r1],[c0,c1],dr,dc){

  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++) out[r][c]='.';
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const nr=r+dr,nc=c+dc;if(m[r][c]!=='.'&&nr>=0&&nc>=0&&nr<12&&nc<12)out[nr][nc]=m[r][c]}
  return out.map(row=>row.join(''));
}

function spriteURL(frames){

  frames.forEach((map,f)=>{

    for(let r=-1;r<13;r++)for(let c=-1;c<13;c++){

function seaURL(g){
  const S=14, cv=document.createElement('canvas'); cv.width=g.cols*S; cv.height=g.rows*S; const x=cv.getContext('2d');
  const rng=mulberry(seedFrom('sea:'+g.key));
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    let base, tick;
    const ring=r===0||c===0||r===g.rows-1||c===g.cols-1;
    if(g.kind==='net'){base=ring?'#6CC4D2':'#9EDFE4';tick=ring?'#E9F8F9':null}
    else if(r===0){base='#D6F1F3';tick='#FFFFFF'}
    else {const d=(r-1)/(g.rows-2);base=`hsl(${186+d*8} ${58-d*14}% ${75-d*20}%)`;tick=`hsl(${186+d*8} ${58-d*14}% ${81-d*20}%)`}
    x.fillStyle=base; x.fillRect(c*S,r*S,S,S);
    if(!tick) continue;
    x.fillStyle=tick;
    for(let k=0;k<2;k++) if(rng()<.35){const wx=c*S+Math.floor(rng()*8), wy=r*S+2+Math.floor(rng()*10); x.fillRect(wx,wy,3,1); x.fillRect(wx+3,wy-1,2,1)}
  }
  if(g.kind==='net'){x.fillStyle='rgba(16,50,74,.08)';for(let c=1;c<g.cols;c++)x.fillRect(c*S,0,1,g.rows*S);for(let r=1;r<g.rows;r++)x.fillRect(0,r*S,g.cols*S,1)}
  if(g.kind==='line'){x.fillStyle='#FFFFFF';for(let c=0;c<g.cols*S;c+=4)x.fillRect(c,0,2,1)}

}

// ---------- deterministic randomness ----------
function seedFrom(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}

const ri=(rng,a,b)=>a+Math.floor(rng()*(b-a+1));

const emptyGrid=(R,C)=>Array.from({length:R},()=>Array.from({length:C},()=>({rock:false,sp:null})));

// ---------- generation: net ----------
function genNet(g,rng){
  g.start=[ri(rng,0,g.rows-1),ri(rng,0,g.cols-1)];
  const G=emptyGrid(g.rows,g.cols); const [sr,sc]=g.start;
  const inB=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols;
  const nearBoat=(r,c)=>Math.abs(r-sr)+Math.abs(c-sc)<=2;
  const free=(r,c)=>inB(r,c)&&!G[r][c].rock&&!G[r][c].sp&&!nearBoat(r,c);
  const put=(sp,r,c)=>{if(free(r,c)){G[r][c].sp=sp;return true}return false};
  for(let f=0;f<5;f++){
    let r=ri(rng,0,g.rows-1), c=ri(rng,0,g.cols-1), d=ri(rng,0,3);
    for(let n=ri(rng,3,7);n>0;n--){
      if(free(r,c)) G[r][c].rock=true;
      if(rng()<.4) d=ri(rng,0,3);
      const [dr,dc]=[[1,0],[-1,0],[0,1],[0,-1]][d];
      r=Math.max(0,Math.min(g.rows-1,r+dr)); c=Math.max(0,Math.min(g.cols-1,c+dc));
    }
  }
  const posW=[['sardinha',6],['lula',2],['dourada',2]];
  const negs=['tartaruga','golfinho','tubarao','tartaruga'];
  for(let k=0;k<5;k++){
    const cr=ri(rng,1,g.rows-2), cc=ri(rng,1,g.cols-2);
    let want=ri(rng,4,6);
    for(let t=0;t<30&&want>0;t++){if(put(weighted(rng,posW),cr+ri(rng,-2,2),cc+ri(rng,-2,2)))want--}
    if(k<4){for(let t=0;t<20;t++){if(put(negs[k],cr+ri(rng,-1,1),cc+ri(rng,-1,1)))break}}
  }
  for(let n=2,t=0;n>0&&t<40;t++){if(put('lagosta',ri(rng,0,g.rows-1),ri(rng,0,g.cols-1)))n--}
  for(let n=1,t=0;n>0&&t<40;t++){if(put(rng()<.5?'golfinho':'tubarao',ri(rng,0,g.rows-1),ri(rng,0,g.cols-1)))n--}
  return G;
}

// ---------- generation: line ----------
function genLine(g,rng){
  g.start=[0,ri(rng,0,g.cols-1)];
  for(let attempt=0;attempt<60;attempt++){
    const G=emptyGrid(g.rows,g.cols); const R=g.rows, C=g.cols;
    const [sr,sc]=g.start;
    const free=(r,c)=>r>=1&&c>=0&&r<R&&c<C&&!G[r][c].rock&&!G[r][c].sp&&!(r===1&&c===sc);
    const zone=(sp,r0,r1,n,rock)=>{for(let t=0;t<80&&n>0;t++){const r=ri(rng,r0,r1),c=ri(rng,0,C-1);if(free(r,c)){if(rock)G[r][c].rock=true;else G[r][c].sp=sp;n--}}};
    zone(null,3,R-1,7,true);
    zone('golfinho',1,4,1);
    zone('tartaruga',3,7,2);
    zone('tubarao',5,9,2);
    zone('coral',R-2,R-1,3);
    zone('sardinha',1,3,7);
    zone('lula',2,5,3);
    zone('dourada',4,8,4);
    zone('caranguejo',R-1,R-1,2);
    zone('lagosta',R-2,R-1,1);
    // make sure a path to the seabed exists
    const dist=new Map([[key(sr,sc),0]]); const q=[[sr,sc]]; let best=Infinity;
    while(q.length){const [r,c]=q.shift();const d=dist.get(key(r,c));if(r===R-1)best=Math.min(best,d);
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr<1||nc<0||nr>=R||nc>=C)continue;const cell=G[nr][nc];if(cell.rock||cell.sp)continue;if(dist.has(key(nr,nc)))continue;dist.set(key(nr,nc),d+1);q.push([nr,nc])}}
    if(best<=g.maxLen-4) return G;
  }
  return emptyGrid(g.rows,g.cols);
}

// ---------- generation: drop ----------
function syncDrop(g){
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++) g.grid[r][c].sp=g.cells[r][c];
}
function buildDrop(g,rng){
  const R=g.rows, C=g.cols;
  const cells=Array.from({length:R},()=>Array(C).fill(null));
  const species=['sardinha','dourada','lula','caranguejo'];
  for(let c=0;c<C;c++){
    for(let r=R-1;r>=1;r--){
      const below=r<R-1?cells[r+1][c]:null, left=c>0?cells[r][c-1]:null;
      cells[r][c]=(rng()<.55&&(below||left))?(below||left):species[ri(rng,0,species.length-1)];
    }
  }
  let placed=0;
  while(placed<2){
    const r=ri(rng,2,7), c=ri(rng,0,C-1);
    if(cells[r][c]!=='tartaruga'){cells[r][c]='tartaruga';placed++}
  }
  return cells;
}
// Greedy play (always the biggest school) is the obvious plan; a day only passes when the obvious plan
// scores at most 65% of the optimum and the optimum needs a small setup cast, so the map has something to find.
const DROP_TRIES=80;
function greedyDrop(cells,lances){
  let total=0;
  for(let i=0;i<lances;i++){
    let pick=null;
    for(let c=0;c<cells[0].length;c++){const res=dropFish(cells,c);if(!res.why&&(!pick||res.points>pick.points))pick=res}
    if(!pick) break;
    total+=pick.points; cells=pick.cells;
  }
  return total;
}
function genDrop(g,rng){
  g.start=[0,Math.floor(g.cols/2)];
  let fallback=null, fallbackRatio=2;
  for(let t=0;t<DROP_TRIES;t++){
    const cells=buildDrop(g,rng), opt=solveDrop(cells,g.lances), ratio=greedyDrop(cells,g.lances)/opt.best;
    if(ratio<=.65&&opt.path.some(p=>p<=4)){g.cells0=cells;g.tries=t+1;return emptyGrid(g.rows,g.cols)}
    if(ratio<fallbackRatio){fallbackRatio=ratio;fallback=cells}
  }
  g.cells0=fallback; g.tries=DROP_TRIES; return emptyGrid(g.rows,g.cols);
}
function dropTarget(cells,c){
  for(let r=1;r<cells.length;r++) if(cells[r][c]!=null) return r;
  return -1;
}
function dropGroup(cells,r,c){
  const sp=cells[r][c]; if(sp==null) return [];
  const R=cells.length, C=cells[0].length;
  const seen=new Set([key(r,c)]), stack=[[r,c]], out=[[r,c]];
  while(stack.length){
    const [cr,cc]=stack.pop();
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=cr+dr, nc=cc+dc;
      if(nr<1||nr>=R||nc<0||nc>=C||seen.has(key(nr,nc))||cells[nr][nc]!==sp) continue;
      seen.add(key(nr,nc)); stack.push([nr,nc]); out.push([nr,nc]);
    }
  }
  return out;
}
function dropFish(cells,c){
  const r=dropTarget(cells,c);
  if(r<0) return {cells,caught:[],sp:null,points:0,why:'empty'};
  const sp=cells[r][c];
  if(sp==='tartaruga') return {cells,caught:[],sp,points:0,why:'turtle'};
  const group=dropGroup(cells,r,c);
  const R=cells.length, C=cells[0].length;
  const next=cells.map(row=>row.slice());
  for(const [gr,gc] of group) next[gr][gc]=null;
  for(let cc=0;cc<C;cc++){
    const colVals=[];
    for(let rr=1;rr<R;rr++) if(next[rr][cc]!=null) colVals.push(next[rr][cc]);
    for(let rr=1;rr<R;rr++) next[rr][cc]=null;
    let write=R-1;
    for(let i=colVals.length-1;i>=0;i--){ next[write][cc]=colVals[i]; write--; }
  }
  return {cells:next, caught:group, sp, points:group.length*group.length, why:null};
}
function solveDrop(cells0,lances){
  const memo=new Map();
  let nodes=0, complete=true;
  const keyOf=(cells,rem)=>JSON.stringify(cells)+':'+rem;
  const choice=new Map();
  function dfs(cells,rem){
    if(rem===0) return 0;
    // node cap: bails out of the DFS once the branching factor makes an exact solve too slow, and reports the partial best instead
    if(++nodes>200000){ complete=false; return 0 }
    const k=keyOf(cells,rem);
    if(memo.has(k)) return memo.get(k);
    let best=0, bestC=-1;
    for(let c=0;c<cells[0].length;c++){
      const res=dropFish(cells,c);
      if(res.why) continue;
      const v=res.points+dfs(res.cells,rem-1);
      if(v>best){best=v;bestC=c}
    }
    memo.set(k,best); choice.set(k,bestC);
    return best;
  }
  const best=dfs(cells0,lances), path=[];
  for(let cells=cells0,rem=lances;rem>0;rem--){
    const c=choice.get(keyOf(cells,rem)); if(c==null||c<0) break;
    const res=dropFish(cells,c); path.push(res.points); cells=res.cells;
  }
  return {best,complete,path};
}

// Buoys, rocks and the boat are fence; the catch is whatever the open sea cannot reach on the boat's side.
function evaluateBuoys(g){
  const [sr,sc]=g.start, D=[[1,0],[-1,0],[0,1],[0,-1]], inB=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols;
  const wall=(r,c)=>g.marks.has(key(r,c))||g.grid[r][c].rock||r===sr&&c===sc;
  const out=new Set(), q=[];
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++) if((r===0||c===0||r===g.rows-1||c===g.cols-1)&&!wall(r,c)){out.add(key(r,c));q.push([r,c])}
  while(q.length){const [r,c]=q.pop();for(const [dr,dc] of D){const nr=r+dr,nc=c+dc,k=key(nr,nc);if(!inB(nr,nc)||wall(nr,nc)||out.has(k))continue;out.add(k);q.push([nr,nc])}}
  const inside=new Set(), hits=[];
  for(const [dr,dc] of D){const r0=sr+dr,c0=sc+dc;if(!inB(r0,c0)||wall(r0,c0)||out.has(key(r0,c0))||inside.has(key(r0,c0)))continue;
    inside.add(key(r0,c0)); q.push([r0,c0]);
    while(q.length){const [r,c]=q.pop();for(const [er,ec] of D){const nr=r+er,nc=c+ec,k=key(nr,nc);if(!inB(nr,nc)||wall(nr,nc)||inside.has(k))continue;inside.add(k);q.push([nr,nc])}}}
  for(const k of inside){const r=Math.floor(k/100),c=k%100;if(g.grid[r][c].sp)hits.push([r,c])}
  return {hits:inside.size?hits:null,inside,onP:g.marks};
}
// The marks must form one chain from the boat to the seabed: a single end, no branch, never touching itself
// (every marked square has at most two marked neighbours, counting the boat).
function lineChain(g){
  const [sr,sc]=g.start, on=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols&&(r===sr&&c===sc||g.marks.has(key(r,c)));
  const nb=(r,c)=>[[1,0],[-1,0],[0,1],[0,-1]].map(([dr,dc])=>[r+dr,c+dc]).filter(([r,c])=>on(r,c));
  if(!g.marks.size) return {path:null,why:'start'};
  for(const k of g.marks) if(nb(Math.floor(k/100),k%100).length>2) return {path:null,why:'self'};
  const path=[[sr,sc]];
  for(let prev=null,cur=[sr,sc];;){
    const next=nb(...cur).filter(([r,c])=>!prev||r!==prev[0]||c!==prev[1]);
    if(!next.length) break;
    prev=cur; cur=next[0]; path.push(cur);
  }
  return path.length-1===g.marks.size&&path.at(-1)[0]===g.rows-1?{path,why:null}:{path:null,why:'go'};
}
const lineCost=g=>[...g.marks].reduce((s,k)=>s+(g.grid[Math.floor(k/100)][k%100].sp?2:1),0);
function evaluate(g){
  if(g.buoy) return evaluateBuoys(g);
  const path=lineChain(g).path;
  if(!path) return {hits:null,inside:null,onP:g.marks};
  const onP=new Set(path.map(p=>key(p[0],p[1]))), hits=[], seen=new Set();
  for(const [r,c] of path){const sp=g.grid[r][c].sp;if(sp&&SP[sp].p<0&&!seen.has(key(r,c))){seen.add(key(r,c));hits.push([r,c])}}
  for(const [r,c] of path){for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=key(nr,nc);if(nr<0||nc<0||nr>=g.rows||nc>=g.cols||onP.has(k)||seen.has(k))continue;if(g.grid[nr][nc].sp){seen.add(k);hits.push([nr,nc])}}}

function scoreOf(g,hits,inside){
  let s=hits.reduce((s,[r,c])=>s+pts(g,g.grid[r][c].sp),0);
  const cd=g.card||{}, at=k=>g.grid[Math.floor(k/100)][k%100];
  if(cd.empty) for(const k of inside) if(!at(k).sp) s+=cd.empty;
  if(cd.release) for(const k of g.marks){const sp=at(k).sp;if(sp&&SP[sp].p<0) s+=cd.release}
  return s;

// Self-contained: it is stringified into a Web Worker. Every species has non-zero points, so v !== 0 means "an animal is here".
function solveLine(m){
  const R=m.rows, C=m.cols, D=[[1,0],[-1,0],[0,1],[0,-1]], on=new Uint8Array(R*C), path=[m.start];
  let best=-Infinity, worst=Infinity, bestPath=null, worstPath=null;
  const score=()=>{
    let s=0; const seen=new Uint8Array(R*C);
    for(const [r,c] of path){const x=m.v[r][c];if(x<0&&!seen[r*C+c]){seen[r*C+c]=1;s+=x}}
    for(const [r,c] of path)for(const [dr,dc] of D){const nr=r+dr,nc=c+dc,k=nr*C+nc;if(nr<0||nc<0||nr>=R||nc>=C||on[k]||seen[k])continue;if(m.v[nr][nc]){seen[k]=1;s+=m.v[nr][nc]}}
    return s;
  };
  on[m.start[0]*C+m.start[1]]=1;
  (function dfs(r,c,moves){
    if(r===R-1){const s=score();if(s>best){best=s;bestPath=path.slice()}if(s<worst){worst=s;worstPath=path.slice()}}
    for(const [dr,dc] of D){
      const nr=r+dr,nc=c+dc,k=nr*C+nc;
      if(nr<1||nc<0||nr>=R||nc>=C||on[k]||m.rock[nr][nc]) continue;
      if(D.some(([er,ec])=>{const ar=nr+er,ac=nc+ec;return (ar!==r||ac!==c)&&ar>=0&&ac>=0&&ar<R&&ac<C&&on[ar*C+ac]})) continue;

      if(moves+cost+(R-1-nr)>m.maxLen) continue;
      on[k]=1;path.push([nr,nc]);dfs(nr,nc,moves+cost);path.pop();on[k]=0;
    }
  })(m.start[0],m.start[1],0);

}

      const hi=cs.reduce((a,b)=>b[1]>a[1]?b:a), lo=cs.reduce((a,b)=>b[2]<a[2]?b:a);
      done({best:hi[1],worst:lo[2],exact:true,bestBuoys:unpackCells(g,hi[3]),worstBuoys:unpackCells(g,lo[4]),bestCard:hi[0],worstCard:lo[0]});

function setup(g){
  const root=document.getElementById('game-'+g.key);
  g.el={}; root.querySelectorAll('[data-k]').forEach(n=>g.el[n.dataset.k]=n);
  g.tab=document.getElementById('tab-'+g.key);
  g.board=g.el.board;
  g.el.card?.addEventListener('click',e=>{const k=e.target.closest('[data-card]')?.dataset.card;if(!k||g.last||k===g.cardKey)return;setCard(g,k);g.showing=null;render(g)});
  g.bubble=document.createElement('div'); g.bubble.className='bubble'; g.bubble.hidden=true; g.board.parentNode.appendChild(g.bubble);
  g.board.style.setProperty('--cols',g.cols); g.board.style.setProperty('--rows',g.rows);
  g.board.style.backgroundImage=`url(${seaURL(g)})`;
  new ResizeObserver(()=>{const cell=g.board.clientWidth/g.cols;g.board.style.setProperty('--spx',14*Math.max(1,Math.floor(cell*.9/14))+'px')}).observe(g.board);
  g.training=false;
  g.storeKey=`goodcatch:${DATE}:${g.key}`;
  g.rec=load(g.storeKey)||{best:null,worst:null,tries:0};
  g.trainRec={best:null,worst:null,tries:0};
  g.last=null;
  if(g.kind==='drop') g.el.go.hidden=true;
  newMap(g, DATE+':'+g.key);

  let drawing=false;
  const cellAt=e=>{const b=g.board.getBoundingClientRect();const c=Math.floor((e.clientX-b.left)/b.width*g.cols);const r=Math.floor((e.clientY-b.top)/b.height*g.rows);return (r>=0&&c>=0&&r<g.rows&&c<g.cols)?[r,c]:null};
  g.board.addEventListener('pointerdown',e=>{
    const cell=cellAt(e);if(!cell)return;
    if(g.kind==='drop'){
      if(g.last||g.busy) return;
      const c=cell[1], targetRow=dropTarget(g.cells,c), res=dropFish(g.cells,c);
      if(res.why==='turtle'){g.blocked='turtle'+c;g.blockReason='turtle';spawn(g,targetRow,c,'blocked');render(g);return}
      if(res.why==='empty') return;
      dropAnimate(g,c,targetRow,res);
      return;
    }
    drawing=true;try{g.board.setPointerCapture(e.pointerId)}catch(_){}g.showing=null;
    g.paint=!g.marks.has(key(...cell)); g.painted=key(...cell); paint(g,cell); render(g);
  });
  g.board.addEventListener('pointermove',e=>{
    if(g.kind==='drop'){
      const cell=cellAt(e), hc=cell?cell[1]:null;
      if(hc!==g.hoverCol){g.hoverCol=hc; render(g)}
      return;
    }
    if(!drawing)return;const cell=cellAt(e);if(!cell)return;
    // Fast drags skip squares between pointer events; walk one square at a time so the stroke has no gaps.
    let [r,c]=[Math.floor(g.painted/100),g.painted%100];
    if(r===cell[0]&&c===cell[1]) return;
    while(r!==cell[0]||c!==cell[1]){
      if(Math.abs(cell[0]-r)>=Math.abs(cell[1]-c)) r+=Math.sign(cell[0]-r); else c+=Math.sign(cell[1]-c);
      paint(g,[r,c]);
    }
    g.painted=key(...cell); render(g);
  });
  g.board.addEventListener('pointerleave',()=>{if(g.kind==='drop'&&g.hoverCol!=null){g.hoverCol=null;render(g)}});
  const stop=()=>{drawing=false};
  g.board.addEventListener('pointerup',stop); g.board.addEventListener('pointercancel',stop);
  g.el.undo.addEventListener('click',()=>{
    if(g.kind==='drop'){const h=g.history.pop();if(h){g.cells=h.cells;g.score=h.score;g.moves=h.moves;g.blocked=null;syncDrop(g);render(g)}return}
    const h=g.history.pop();if(h){h[0]?g.marks.delete(h[1]):g.marks.add(h[1]);g.blocked=null;g.showing=null;render(g)}
  });
  g.el.clear.addEventListener('click',()=>{
    if(g.kind==='drop'){g.cells=g.cells0.map(row=>row.slice());g.moves=0;g.score=0;g.history=[];g.blocked=null;syncDrop(g);render(g);return}
    g.marks.clear();g.history=[];g.blocked=null;g.showing=null;render(g);
  });
  g.el.go.addEventListener('click',()=>commit(g));
  g.el.result.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]')?.dataset.act;
    if(a==='again'){g.last=null;g.blocked=null;render(g)}
    if(a==='share') share(g.el.result.querySelector('.note'));
    if(a==='best'||a==='worst') reveal(g,a);
  });
}

function reveal(g,which){
  if(!g.training&&!frozen(g.rec)){
    const d=document.getElementById('reveal');
    d.returnValue=''; d.onclose=()=>{if(d.returnValue!=='yes')return;g.rec.revealed=true;save(g.storeKey,g.rec);reveal(g,which)};
    return d.showModal();
  }
  g.last=null; g.blocked=null; g.showing=which;
  const ck=g.ref[which+'Card']; if(ck&&ck!==g.cardKey) setCard(g,ck);
  g.marks=new Set(g.buoy?g.ref[which+'Buoys']:g.ref[which+'Path'].slice(1).map(([r,c])=>key(r,c))); g.history=[];
  render(g);
}

function paint(g,[r,c]){
  const k=key(r,c);
  if(isStart(g,r,c)||g.kind==='line'&&r<1||g.paint===g.marks.has(k)) return;
  const cost=g.grid[r][c].sp?2:1;
  const why=!g.paint?null:g.buoy?(g.grid[r][c].rock?'rockwall':g.marks.size>=g.maxBuoys?'buoys':null)
    :g.grid[r][c].rock?'rock':lineCost(g)+cost>g.maxLen?'budget':null;
  if(why){if(g.blocked!==k+why){g.blocked=k+why;g.blockReason=why;spawn(g,r,c,'blocked')}return}
  g.paint?g.marks.add(k):g.marks.delete(k); g.history.push([g.paint,k]); g.blocked=null;
  if(g.paint&&!g.buoy&&cost===2) spawn(g,r,c,'cost','−2');
}
function toggleTraining(g){
  g.training=!g.training;
  g.card=g.cardKey=g.cards=null;
  if(g.training){
    g.trainRec={best:null,worst:null,tries:0};
    const n=Object.keys(CARD_REF).length;
    if(g.buoy&&n){const i=Math.floor(Math.random()*n);g.cards=CARD_REF['carta:'+i].map(x=>x[0]);newMap(g,'carta:'+i)}
    else newMap(g,'treino:'+Math.random());
  }
  else newMap(g,DATE+':'+g.key);
  g.last=null; render(g);
}

// High tide removes the rocks, so a card switch rebuilds the grid from the seed and drops buoys that would sit on rock.
function setCard(g,k){
  g.card=CARDS[k]; g.cardKey=k;
  g.grid=g.gen(g,mulberry(seedFrom(g.seed))); applyCard(g);
  for(const m of [...g.marks]) if(g.grid[Math.floor(m/100)][m%100].rock){g.marks.delete(m);g.history=[]}
}

function newMap(g,seed){
  g.grid=g.gen(g,mulberry(seedFrom(seed))); applyCard(g);
  g.ref=null; g.seed=seed; g.showing=null; g.blocked=null; g.marks=new Set(); g.history=[];
  if(g.kind==='drop'){
    g.cells=g.cells0.map(row=>row.slice()); g.moves=0; g.score=0; g.par=null; g.hoverCol=null; g.busy=false;
    syncDrop(g);
    setTimeout(()=>{const r=solveDrop(g.cells0,g.lances);if(g.seed!==seed)return;g.par=r.best;render(g)});
    return;
  }
  setTimeout(()=>dailyReference(g,ref=>{if(g.seed!==seed)return;g.ref=ref;render(g)}));
}

const isStart=(g,r,c)=>r===g.start[0]&&c===g.start[1];
function spawn(g,r,c,kind,text=''){
  const b=g.board, m=document.createElement('div');
  m.className='mark '+kind; m.textContent=text;
  m.style.cssText=`left:${b.offsetLeft+c*b.clientWidth/g.cols}px;top:${b.offsetTop+r*b.clientHeight/g.rows}px;width:${b.clientWidth/g.cols}px;height:${b.clientHeight/g.rows}px`;
  b.parentNode.appendChild(m); m.addEventListener('animationend',e=>{if(e.animationName!=='shake')m.remove()});
}

function computeFalls(oldCells,newCells,caughtSet){
  const R=oldCells.length, C=oldCells[0].length, falls=[];
  for(let cc=0;cc<C;cc++){
    const oldRows=[]; for(let r=R-1;r>=1;r--) if(oldCells[r][cc]!=null&&!caughtSet.has(key(r,cc))) oldRows.push(r);
    const newRows=[]; for(let r=R-1;r>=1;r--) if(newCells[r][cc]!=null) newRows.push(r);
    for(let k=0;k<oldRows.length;k++) if(newRows[k]!=null&&newRows[k]!==oldRows[k]) falls.push([oldRows[k],cc,newRows[k]-oldRows[k]]);
  }
  return falls;
}
function dropAnimate(g,c,targetRow,res){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    g.history.push({cells:g.cells,score:g.score,moves:g.moves});
    g.cells=res.cells; g.score+=res.points; g.moves++; g.blocked=null;
    spawn(g,targetRow,c,'cost','+'+res.points); syncDrop(g);
    if(g.moves>=g.lances) commit(g); else render(g);
    return;
  }
  g.busy=true;
  const oldCells=g.cells, b=g.board, cellW=b.clientWidth/g.cols, cellH=b.clientHeight/g.rows;
  const hook=document.createElement('div'); hook.className='hook';
  hook.style.cssText=`left:${b.offsetLeft+c*cellW+cellW/2}px;top:${b.offsetTop+cellH/2}px;height:0px`;
  b.parentNode.appendChild(hook);
  requestAnimationFrame(()=>{hook.style.transition='height .2s ease-in';hook.style.height=(targetRow*cellH)+'px'});
  setTimeout(()=>{
    hook.remove();
    spawn(g,targetRow,c,'cost','+'+res.points);
    const caughtSet=new Set(res.caught.map(([r,cc])=>key(r,cc)));
    for(const [r,cc] of res.caught){
      const sp=g.board.children[r*g.cols+cc]?.querySelector('.sp');
      if(sp){sp.style.transition='transform .25s ease-in, opacity .25s';sp.style.transform=`translateY(${-r*cellH}px)`;sp.style.opacity='0'}
    }
    setTimeout(()=>{
      const falls=computeFalls(oldCells,res.cells,caughtSet);
      for(const [r,cc,dist] of falls){
        const sp=g.board.children[r*g.cols+cc]?.querySelector('.sp');
        if(sp){sp.style.transition='transform .25s ease-out';sp.style.transform=`translateY(${dist*cellH}px)`}
      }
      // A fixed timeout instead of transitionend: transitionend can be skipped/coalesced, a timer always fires.
      setTimeout(()=>{
        g.history.push({cells:oldCells,score:g.score,moves:g.moves});
        g.cells=res.cells; g.score+=res.points; g.moves++; g.blocked=null;
        syncDrop(g); g.busy=false;
        if(g.moves>=g.lances) commit(g); else render(g);
      },260);
    },250);
  },200);
}

const ready=g=>{const e=evaluate(g);return !!e.hits&&!(g.cards&&!g.card)&&!overArea(g,e.inside)};
const fmt=s=>s>0?'+'+s:s<0?'−'+Math.abs(s):'0';
const cls=s=>s>0?'good':s<0?'bad':'zero';

function renderDrop(g){
  let html='';
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    const cell=g.grid[r][c], cl=['c']; let inner='';
    if(isStart(g,r,c)){inner=sprite('boat');cl.push('boat')}
    else if(cell.sp){
      const s=SP[cell.sp]; if(s.p<0) cl.push('neg');
      if(cell.sp===spotlight) cl.push('lit');
      inner=sprite(cell.sp,` title="${spName(cell.sp)} ${fmt(s.p)}"`);
    }
    html+=`<div class="${cl.join(' ')}">${inner}</div>`;
  }
  let svg=`<svg class="ov" viewBox="0 0 ${g.cols} ${g.rows}" preserveAspectRatio="none" aria-hidden="true">`;
  if(g.hoverCol!=null&&!g.last){
    const tr=dropTarget(g.cells,g.hoverCol);
    if(tr>=0) svg+=`<line x1="${g.hoverCol+.5}" y1="0" x2="${g.hoverCol+.5}" y2="${tr+.5}" stroke="#10324A" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  }
  svg+='</svg>';
  g.board.style.setProperty('--clock',`${-(performance.now()%1200)}ms`);
  g.board.innerHTML=html+svg;
  g.board.classList.toggle('spot',!!spotlight);
  g.el.count.innerHTML=`${t('lances')}: <b>${g.lances-g.moves}</b>`;
  g.el.pv.innerHTML=`${t('catch')}: <b class="good">${g.score}</b>`;
  g.el.pv.className='pv';
  g.el.hint.textContent=g.blocked?t('block_turtle_fundo'):t('hint_fundo_start');
  g.el.hint.classList.toggle('alert',!!g.blocked);
  g.bubble.hidden=true;
  g.el.undo.disabled=!g.history.length||g.busy; g.el.clear.disabled=!g.history.length||g.busy;
  g.el.train.hidden=!g.training;
  g.tab.querySelector('small').innerHTML=g.rec.tries?`${arr('up')}${fmt(g.rec.best)}`:'';
  if(g===current()) document.getElementById('train-btn').textContent=t(g.training?'practice_off':'practice_on');
  renderResult(g);
}

function render(g){
  if(g.kind==='drop'){renderDrop(g);return}
  const {hits,inside,onP}=evaluate(g);
  const hitSet=new Set((hits||[]).map(([r,c])=>key(r,c)));
  let html='';
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    const cell=g.grid[r][c], k=key(r,c), cl=['c']; let inner='', st='';
    if(inside&&inside.has(k)){cl.push('in');st=` style="--d:${Math.abs(r-g.start[0])+Math.abs(c-g.start[1])}"`}
    if(cell.rock){cl.push('rock');inner=sprite('rock')}
    if(isStart(g,r,c)){inner=sprite('boat');cl.push('boat')}
    else if(cell.sp){
      const p=pts(g,cell.sp); if(p<0) cl.push('neg');
      if(hitSet.has(k)&&!g.buoy) cl.push('hit', p>0?'good':'bad');
      if(onP.has(k)&&!hitSet.has(k)) cl.push('gone');
      if(cell.sp===spotlight) cl.push('lit');
      inner=sprite(cell.sp,` title="${spName(cell.sp)} ${fmt(p)}"`);
    }
    if(g.buoy&&g.marks.has(k)) inner+=sprite('buoy');
    html+=`<div class="${cl.join(' ')}"${st}>${inner}</div>`;
  }
  let svg=`<svg class="ov" viewBox="0 0 ${g.cols} ${g.rows}" preserveAspectRatio="none" aria-hidden="true">`;
  if(g.buoy){
    if(inside&&inside.size){
      const edge=(d,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--d:${d}" class="rope" stroke="#10324A" stroke-width="3" stroke-linecap="square" vector-effect="non-scaling-stroke"/>`;
      for(const k of inside){
        const r=Math.floor(k/100),c=k%100, d=Math.abs(r-g.start[0])+Math.abs(c-g.start[1]), out=(rr,cc)=>!inside.has(key(rr,cc));
        if(out(r-1,c)) svg+=edge(d,c,r,c+1,r);
        if(out(r+1,c)) svg+=edge(d,c,r+1,c+1,r+1);
        if(out(r,c-1)) svg+=edge(d,c,r,c,r+1);
        if(out(r,c+1)) svg+=edge(d,c+1,r,c+1,r+1);
      }
    } else {
      const mine=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols&&(g.marks.has(key(r,c))||isStart(g,r,c));
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++) if(mine(r,c)) for(const [dr,dc] of [[0,1],[1,0]]) if(mine(r+dr,c+dc))
        svg+=`<line x1="${c+.5}" y1="${r+.5}" x2="${c+dc+.5}" y2="${r+dr+.5}" stroke="#10324A" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
    }
  } else {
    const on=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols&&(g.marks.has(key(r,c))||isStart(g,r,c)), end=hits&&lineChain(g).path.at(-1);
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++) if(on(r,c)){
      for(const [dr,dc] of [[0,1],[1,0]]) if(on(r+dr,c+dc)) svg+=`<line x1="${c+.5}" y1="${r+.5}" x2="${c+dc+.5}" y2="${r+dr+.5}" stroke="#10324A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
      if(!isStart(g,r,c)) svg+=`<circle cx="${c+.5}" cy="${r+.5}" r="${end&&end[0]===r&&end[1]===c?.18:.1}" fill="${end&&end[0]===r&&end[1]===c?'#F08A24':'#10324A'}"/>`;
    }
  }
  svg+='</svg>';
  // innerHTML rebuilds every sprite on each render; a negative delay pinned to the page clock keeps the animations from restarting.
  g.board.style.setProperty('--clock',`${-(performance.now()%1200)}ms`);
  if(g.buoy){g.closedAt=inside?.size?g.closedAt??performance.now():null;g.board.style.setProperty('--since',g.closedAt?`${g.closedAt-performance.now()}ms`:'0s');g.board.classList.toggle('started',g.marks.size>0)}
  g.board.innerHTML=html+svg;
  const why=g.buoy?(hits?(g.cards&&!g.card?'card':overArea(g,inside)?'area':null):g.marks.size?'go':'start'):lineChain(g).why;
  g.board.classList.toggle('spot',!!spotlight);

  g.el.count.innerHTML=g.buoy?`${t('left_buoys')}: <b>${g.maxBuoys-g.marks.size}</b>`:`${t('left_'+g.key)}: <b>${g.maxLen-lineCost(g)}</b>`;
  const now=hits&&scoreOf(g,hits,inside);
  g.el.pv.innerHTML=hits?`${t('catch')}: <b class="${cls(now)}">${fmt(now)}</b>`:`${t('catch')}: <b>—</b>`;
  g.el.pv.className='pv '+(hits?cls(now):'');
  if(g.el.card){g.el.card.hidden=!g.cards;if(g.cards)g.el.card.innerHTML=g.cards.map(k=>{const [art,rank,kind]=CARD_ART[k];return `<button class="card ${kind}" data-card="${k}" aria-pressed="${k===g.cardKey}"><span class="art">${rank?`<span class="rank">${rank}</span>`:''}${sprite(art)}</span><b>${t('cardname_'+k)}</b><span class="rule">${t('cardrule_'+k)}</span></button>`}).join('');g.el.card.classList.toggle('picked',!!g.card)}
  g.el.hint.textContent=g.showing?t('showing_'+g.showing).replace('{n}',fmt(g.ref[g.showing]))
    :g.blocked?t(`block_${g.blockReason}_${g.key}`)
    :t(`hint_${g.key}_${why||'ready'}`);
  g.el.hint.classList.toggle('alert',!!g.blocked);
  const say=(g.blocked||!why||why==='self'||why==='area'||why==='card')&&!g.showing&&!g.last, sayKey=g.blocked||why||'ready';
  g.bubble.hidden=!say;
  if(!say) delete g.bubble.dataset.k;
  if(say){
    const b=g.board, cw=b.clientWidth/g.cols, ch=b.clientHeight/g.rows, [br,bc]=g.start, lastK=g.history.at(-1)?.[1], focus=lastK!=null?Math.floor(lastK/100):br, below=br<2||focus<br&&br<g.rows-2;
    if(g.bubble.dataset.k!==sayKey){g.bubble.dataset.k=sayKey;g.bubble.getAnimations().forEach(a=>{a.cancel();a.play()})}
    g.bubble.textContent=g.el.hint.textContent; g.bubble.classList.toggle('below',below);
    const w=g.bubble.offsetWidth, h=g.bubble.offsetHeight, x=b.offsetLeft+(bc+.5)*cw;
    const left=Math.max(b.offsetLeft+4,Math.min(x-w/2,b.offsetLeft+b.clientWidth-w-4));
    g.bubble.style.left=left+'px';
    g.bubble.style.top=(below?b.offsetTop+(br+1)*ch+10:b.offsetTop+br*ch-h-10)+'px';
    g.bubble.style.setProperty('--tail',x-left+'px');
    g.bubble.style.transformOrigin=`${x-left}px ${below?0:h}px`;
  }
  g.el.go.disabled=!ready(g);
  g.el.undo.disabled=!g.history.length; g.el.clear.disabled=!g.marks.size;
  g.el.train.hidden=!g.training;
  g.tab.querySelector('small').innerHTML=g.rec.tries?`${arr('up')}${fmt(g.rec.best)} ${arr('down')}${fmt(g.rec.worst)}`:'';
  if(g===current()) document.getElementById('train-btn').textContent=t(g.training?'practice_off':'practice_on');
  renderResult(g);
}

function verdict(s){return t(s>=25?'v1':s>=12?'v2':s>0?'v3':s===0?'v4':s>-15?'v5':'v6')}

function renderResult(g){
  const L=g.last; g.el.result.hidden=!L; g.el.board.closest('.game').classList.toggle('done',!!L); if(!L) return;
  g.board.parentNode.querySelectorAll('.mark').forEach(m=>m.remove());
  const rec=g.training?g.trainRec:g.rec;
  if(g.kind==='drop'){
    const verdictText=g.par!=null&&L.score>=g.par?t('par_hit'):t('par_over').replace('{n}',g.par-L.score);
    g.el.result.innerHTML=`<div class="big good">${L.score}</div>
      <div class="verdict">${verdictText}</div>
      <div class="recs"><span>${t('your_best')} <b class="big-good">${arr('up')}${fmt(rec.best)}</b></span></div>
      ${g.par!=null?`<p class="range-note">${t('par_is').replace('{n}',g.par)}</p>`:''}
      ${!g.training&&rec.locked?`<p class="range-note">${t('locked')}</p>`:''}
      <div class="controls"><button class="btn" data-act="again">${t('try_again')}</button><button class="btn primary" data-act="share"${g.training?' disabled':''}>${t('share')}</button></div>
      <p class="note" aria-live="polite"></p>`;
    return;
  }
  const chips=(Object.entries(L.count).sort((a,b)=>pts(g,b[0])-pts(g,a[0])).map(([k,n])=>{const p=pts(g,k)*n;return `<span title="${spName(k)}">${sprite(k)}×${n} <span class="${p>0?'pos':'neg-t'}">${fmt(p)}</span></span>`}).join('')
    +(L.extra?`<span>${t('card_extra')} <span class="${L.extra>0?'pos':'neg-t'}">${fmt(L.extra)}</span></span>`:''))||`<span>${t('nothing')}</span>`;
  const pct=g.card&&g.ref?.best>0?`<p class="range-note">${t('pct').replace('{n}',String(Math.round(100*L.score/g.ref.best)).replace('-','−'))}</p>`
    +(g.ref.bestCard!==g.cardKey?`<p class="range-note">${t('best_card').replace('{c}',t('cardname_'+g.ref.bestCard))}</p>`:''):'';
  g.el.result.innerHTML=`<div class="big ${cls(L.score)}">${fmt(L.score)}</div>
    <div class="verdict">${verdict(L.score)}</div>
    ${pct}
    <div class="chips">${chips}</div>
    <div class="recs"><span>${t('your_best')} <b class="big-${cls(rec.best)}">${arr('up')}${fmt(rec.best)}</b></span><span>${t('your_lowest')} <b class="big-${cls(rec.worst)}">${arr('down')}${fmt(rec.worst)}</b></span></div>
    ${rangeHTML(g,rec)}
    ${g.ref?.exact&&(g.ref.bestPath||g.ref.bestBuoys)?`<div class="reveal"><button class="btn" data-act="best">${t('see_best')}</button><button class="btn" data-act="worst">${t('see_worst')}</button></div>`:''}
    ${!g.training&&rec.locked?`<p class="range-note">${t('locked')}</p>`:!g.training&&rec.revealed?`<p class="range-note">${t('revealed')}</p>`:''}
    <div class="controls"><button class="btn" data-act="again">${t('try_again')}</button><button class="btn primary" data-act="share"${g.training?' disabled':''}>${t('share')}</button></div>
    <p class="note" aria-live="polite"></p>`;
}

function rangeHTML(g,rec){
  if(g.kind==='drop') return '';
  const ref=g.ref;
  if(!ref) return g.buoy?'':`<p class="range-note">${t('range_wait')}</p>`;
  const beat=!ref.exact&&(rec.best>ref.best||rec.worst<ref.worst);
  if(!ref.exact){ref.best=Math.max(ref.best,rec.best);ref.worst=Math.min(ref.worst,rec.worst)}
  const span=ref.best-ref.worst||1, pos=x=>Math.max(0,Math.min(100,(x-ref.worst)/span*100));
  const notes=[beat&&t('beat_known'),rec.best>=ref.best&&t('top_found'),rec.worst<=ref.worst&&t('low_found')].filter(Boolean);
  return `<div class="range">
    <div class="range-label">${t(ref.exact?(g.training?'range_map':'range'):'range_known')}</div>
    <div class="bar" role="img" aria-label="${t('your_lowest')} ${fmt(rec.worst)}, ${t('your_best')} ${fmt(rec.best)}, ${fmt(ref.worst)} … ${fmt(ref.best)}"><i style="left:${pos(rec.worst)}%;width:${pos(rec.best)-pos(rec.worst)}%"></i></div>
    <div class="range-ends"><span class="big-${cls(ref.worst)}">${arr('down')}${fmt(ref.worst)}</span><span class="big-${cls(ref.best)}">${arr('up')}${fmt(ref.best)}</span></div>
    ${notes.map(n=>`<p class="range-note">${n}</p>`).join('')}
  </div>`;
}

function commit(g){
  if(g.kind==='drop'){
    g.last={score:g.score,count:{}};
    const rec=g.training?g.trainRec:g.rec;
    if(frozen(rec)) return render(g);
    rec.tries++; rec.best=rec.best===null?g.score:Math.max(rec.best,g.score);
    if(TOURNEY&&!g.training) rec.locked=true;
    if(!g.training) save(g.storeKey,rec);
    return render(g);
  }
  if(!ready(g)) return;
  const {hits,inside}=evaluate(g); const score=scoreOf(g,hits,inside);
  const count={}; for(const [r,c] of hits){const k=g.grid[r][c].sp;count[k]=(count[k]||0)+1}
  g.last={score,count,extra:score-hits.reduce((s,[r,c])=>s+pts(g,g.grid[r][c].sp),0)};
  const rec=g.training?g.trainRec:g.rec;
  if(frozen(rec)) return render(g);
  rec.tries++; rec.best=rec.best===null?score:Math.max(rec.best,score); rec.worst=rec.worst===null?score:Math.min(rec.worst,score);
  if(TOURNEY&&!g.training) rec.locked=true;
  if(!g.training) save(g.storeKey,rec);
  render(g);
}

function shareText(){
  let s=`Good Catch #${DAYNUM}\n`;
  for(const g of Object.values(games)){
    const r=g.rec;
    if(!r.tries){ s+=`${g.icon} ${t('game_'+g.key)} ${t('not_played')}\n`; continue; }
    s+= g.kind==='drop' ? `${g.icon} ${t('game_'+g.key)} ▲${fmt(r.best)}\n` : `${g.icon} ${t('game_'+g.key)} ▲${fmt(r.best)} ▼${fmt(r.worst)}\n`;
  }
  return s+'goodcatch.fish';
}
function share(note){
  const txt=shareText();
  const fail=()=>{note.textContent=t('copy_fail')+txt.replace(/\n/g,' · ')};
  const copy=()=>{try{navigator.clipboard.writeText(txt).then(()=>{note.textContent=t('copied')},fail)}catch(e){fail()}};
  if(navigator.share&&matchMedia('(pointer:coarse)').matches) navigator.share({text:txt}).catch(e=>{if(e.name!=='AbortError')copy()});
  else copy();
}

let spotlight=null;
const legend=document.getElementById('legend');
function renderLegend(){
  legend.innerHTML=Object.entries(SP).sort((a,b)=>b[1].p-a[1].p).map(([k,s])=>
    `<button data-sp="${k}" aria-pressed="${k===spotlight}" aria-label="${spName(k)} ${fmt(s.p)}" title="${spName(k)}">${sprite(k)}<span class="${s.p>0?'pos':'neg-t'}">${fmt(s.p)}</span></button>`).join('');
}
legend.addEventListener('click',e=>{
  const b=e.target.closest('[data-sp]'); if(!b) return;
  spotlight=spotlight===b.dataset.sp?null:b.dataset.sp;
  legend.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.sp===spotlight)));
  render(current());
});

let tab='rede';
const current=()=>games[tab];
function showTab(k){
  tab=k;
  for(const x of Object.keys(games)){document.getElementById('game-'+x).hidden=x!==k;document.getElementById('tab-'+x).setAttribute('aria-selected',String(x===k))}
  try{localStorage.setItem('goodcatch:tab',k)}catch(e){}
  render(current());
}
for(const x of Object.keys(games)) document.getElementById('tab-'+x).addEventListener('click',()=>showTab(x));
document.getElementById('train-btn').addEventListener('click',()=>{toggleTraining(current());document.getElementById('menu').hidePopover()});
document.getElementById('tourney-btn').addEventListener('click',()=>{
  TOURNEY=!TOURNEY; try{localStorage.setItem('goodcatch:torneio',TOURNEY?'1':'0')}catch(e){}
  applyText(); for(const g of Object.values(games)) render(g); document.getElementById('menu').hidePopover();
});
document.getElementById('lang-btn').addEventListener('click',()=>{
  LANG=LANG==='pt'?'en':'pt'; try{localStorage.setItem('goodcatch:lang',LANG)}catch(e){}
  applyText(); for(const g of Object.values(games)) render(g); document.getElementById('menu').hidePopover();
});
const help=document.getElementById('help');
document.getElementById('help-btn').addEventListener('click',()=>help.showModal());

applyText();
for(const g of Object.values(games)) setup(g);
let saved=null; try{saved=localStorage.getItem('goodcatch:tab')}catch(e){}
showTab(saved in games?saved:'rede');
for(const g of Object.values(games)) render(g);
let seen=null; try{seen=localStorage.getItem('goodcatch:seenHelp')}catch(e){}
if(!seen){help.showModal();try{localStorage.setItem('goodcatch:seenHelp','1')}catch(e){}}
})();
</script>
