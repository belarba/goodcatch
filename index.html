<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily fishing puzzle. Go for the best catch, or the worst.">
<title>Good Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Jersey+10&display=swap">
<style>
:root{
  color-scheme:dark;
  --abyss:#0A1F2B; --deep:#0F2E3C; --sea:#143B4B; --sea2:#174353; --edge:#24566A;
  --foam:#E8F0EC; --muted:#8DAAB0; --buoy:#F39A36; --rope:#EBDDB4; --sand:#CDB57E;
  --good:#7FDBA9; --bad:#FF7D70;
  --pixel:"Jersey 10",ui-rounded,system-ui,sans-serif;
  --body:Figtree,system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--abyss)}
body{color:var(--foam);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--buoy);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px}

.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.icon-btn{appearance:none;width:40px;height:40px;border:1px solid var(--edge);background:transparent;border-radius:10px;font:400 28px var(--pixel);color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--foam);background:var(--deep)}
h1{font:400 clamp(36px,10vw,44px)/1 var(--pixel);margin:0}
h1 span{color:var(--buoy)}
.date{font:400 18px var(--pixel);color:var(--muted);margin-top:2px}

.menu{margin:0;inset:auto;top:60px;right:max(16px,calc(50vw - 254px));position:fixed;background:var(--deep);color:var(--foam);border:1px solid var(--edge);border-radius:12px;padding:6px;min-width:220px}
.menu button{display:block;width:100%;appearance:none;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--sea2)}

.switch{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--deep);padding:3px;border-radius:12px}
.switch button{appearance:none;border:0;background:transparent;color:var(--muted);font:400 22px/1 var(--pixel);padding:6px;border-radius:9px;cursor:pointer;display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:7px;min-height:52px;white-space:nowrap}
.switch button .sp{grid-row:span 2}
.switch button[aria-selected="true"]{background:var(--sea2);color:var(--foam);box-shadow:inset 0 -2px 0 var(--buoy)}
.switch .sp{width:28px;height:28px}
.switch small{font-size:18px;color:var(--good);text-align:left}
.switch small:empty{display:none}
.switch button:has(small:empty) .sp{grid-row:auto}

.game{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;display:flex;justify-content:center}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);
  aspect-ratio:var(--cols)/var(--rows);width:min(100%, max(260px, calc(var(--cols) / var(--rows) * (100svh - 360px))));
  touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;background:var(--sea) center/100% 100%;
  image-rendering:pixelated;cursor:crosshair}
.board.line{border-bottom:8px solid var(--sand)}
.c{position:relative;display:grid;place-items:center}
.c.in{background:rgba(243,154,54,.22)}
.sp{display:block;width:var(--spx,28px);height:var(--spx,28px);background:center/100% no-repeat;image-rendering:pixelated;position:relative;z-index:1;pointer-events:none}
.c.neg::before,.c.hit::before{content:"";position:absolute;inset:7%;border:2px solid rgba(255,125,112,.55)}
.c.hit.good::before{border-color:var(--good);background:rgba(127,219,169,.18)}
.c.hit.bad::before{border-color:var(--bad);background:rgba(255,125,112,.25)}
.c.gone .sp{opacity:.3}
.board.spot .c:not(.lit) .sp:not(.s-boat){opacity:.25}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

.panel{position:absolute;inset:0;margin:auto;width:min(100%,420px);max-height:100%;overflow:auto;background:rgba(10,31,43,.94);border:1px solid var(--edge);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center;z-index:3}
.big{font:400 72px/1 var(--pixel)}
.big.good,.good b,.pos{color:var(--good)} .big.bad,.bad b,.neg-t{color:var(--bad)} .big.zero{color:var(--muted)}
.verdict{font:400 28px var(--pixel)}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 22px var(--pixel);color:var(--muted)}
.chips span{display:inline-flex;align-items:center;gap:3px}
.chips .sp{width:28px;height:28px}
.big-good{color:var(--good)} .big-bad{color:var(--bad)} .big-zero{color:var(--muted)}
.recs{font:400 22px var(--pixel);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}

.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 22px var(--pixel)}
.meta .count b{font-weight:500}
.meta .count.warn{color:var(--buoy)}
.meta .pv{color:var(--muted)} .meta .pv b{color:var(--foam)}
.badge{font:400 18px var(--pixel);color:var(--abyss);background:var(--buoy);padding:1px 7px;border-radius:5px}
.hint{margin:0;min-height:1.5em;font-size:15px;color:var(--muted);text-align:center}
.hint.alert{color:var(--bad)}
.mark{position:absolute;pointer-events:none;z-index:4;display:grid;place-items:center;font:400 22px var(--pixel)}
.mark.blocked{border:3px solid var(--bad);animation:shake .35s ease-in-out,fade .6s .35s forwards}
.mark.cost{color:var(--bad);text-shadow:0 2px 0 #051019;animation:rise .8s ease-out forwards}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fade{to{opacity:0}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-70%);opacity:0}}
@media (prefers-reduced-motion:reduce){.mark{animation:fade .6s forwards!important}}

.controls{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.panel .controls{grid-template-columns:1fr 1fr}
.game.done>.meta,.game.done>.hint,.game.done>.controls{visibility:hidden}
.btn{appearance:none;border:1px solid var(--edge);background:transparent;font:400 22px var(--pixel);padding:10px 12px;border-radius:10px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--deep)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--buoy);border-color:var(--buoy);color:#1b1206}
.btn.primary:hover:not(:disabled){background:#ffab4e}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center;min-height:1.2em}

.legend{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:var(--deep);border-radius:12px;padding:6px 4px;margin-top:4px}
.legend button{appearance:none;border:0;background:transparent;border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:400 18px var(--pixel)}
.legend button[aria-pressed="true"]{background:var(--sea2)}
.legend .sp{width:28px;height:28px}
.legend .pos,.legend .neg-t{line-height:1}

dialog{background:var(--deep);color:var(--foam);border:1px solid var(--edge);border-radius:14px;padding:20px;max-width:min(92vw,460px)}
dialog::backdrop{background:rgba(5,16,25,.7)}
dialog h2{font:400 28px var(--pixel);margin:0 0 8px}
dialog h3{font:400 22px var(--pixel);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
dialog h3 .sp{width:28px;height:28px}
dialog p{margin:0 0 6px;color:var(--muted)} dialog b{color:var(--foam)}
dialog .btn{width:100%;margin-top:14px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="icon-btn" id="help-btn" data-t-label="how_to_play">?</button>
    <div><h1>Good <span>Catch</span></h1><div class="date" id="date"></div></div>
    <button class="icon-btn" id="menu-btn" popovertarget="menu" data-t-label="menu">≡</button>
  </header>
  <div id="menu" class="menu" popover>
    <button id="train-btn"></button>
    <button id="lang-btn"></button>
  </div>

  <nav class="switch" role="tablist">
    <button role="tab" id="tab-rede"><i class="sp s-sardinha"></i><span data-t="game_rede"></span><small data-k="best"></small></button>
    <button role="tab" id="tab-linha"><i class="sp s-hook"></i><span data-t="game_linha"></span><small data-k="best"></small></button>
  </nav>

  <section class="game" id="game-rede">
    <div class="stage"><div class="board net" data-k="board"></div><div class="panel" data-k="result" hidden></div></div>
    <div class="meta"><span class="count" data-k="count"></span><span class="badge" data-k="train" data-t="practice" hidden></span><span class="pv" data-k="pv"></span></div>
    <p class="hint" data-k="hint" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" data-k="undo" data-t="undo"></button>
      <button class="btn" data-k="clear" data-t="clear"></button>
      <button class="btn primary" data-k="go" data-t="go_rede"></button>
    </div>
  </section>

  <section class="game" id="game-linha" hidden>
    <div class="stage"><div class="board line" data-k="board"></div><div class="panel" data-k="result" hidden></div></div>
    <div class="meta"><span class="count" data-k="count"></span><span class="badge" data-k="train" data-t="practice" hidden></span><span class="pv" data-k="pv"></span></div>
    <p class="hint" data-k="hint" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" data-k="undo" data-t="undo"></button>
      <button class="btn" data-k="clear" data-t="clear"></button>
      <button class="btn primary" data-k="go" data-t="go_linha"></button>
    </div>
  </section>

  <div class="legend" id="legend"></div>
</div>

<dialog id="help">
  <h2 data-t="how_to_play"></h2>
  <div id="help-body"></div>
  <form method="dialog"><button class="btn primary" data-t="got_it"></button></form>
</dialog>

<script>
(function(){
const SP = {
  sardinha:{p:1},
  lula:{p:2},
  caranguejo:{p:2},
  dourada:{p:3},
  lagosta:{p:5},
  coral:{p:-3},
  tubarao:{p:-4},
  tartaruga:{p:-6},
  golfinho:{p:-8},
};

// ---------- pixel sprites ----------
const PAL = {
  s:'#5E8FA3', b:'#9CC3CF', e:'#0A1F2B', w:'#EDEAE0',
  p:'#D98BB0', P:'#A9608A',
  o:'#E0703A', O:'#B24E22',
  y:'#E9C25A', Y:'#C9962E',
  r:'#D8553A', R:'#A33A28', c:'#E86A4A',
  k:'#F07C9A', K:'#B8466A',
  G:'#7F929E', u:'#D3DDE1',
  h:'#9BC46A', f:'#7FA84E', g:'#3F6B33', v:'#6E9B4A',
  d:'#6F9FC4', D:'#4C7DA3',
  m:'#6B4A2E', n:'#F39A36', N:'#C8741F',
  q:'#7A8A8C', Q:'#56666A', z:'#36454A',
  x:'#C9D3D6', l:'#EBDDB4',
};
const SPRITES = {
  sardinha:["............","............","............",".....ssss...",".s..ssssss..",".ss.sssssses","..bbbbbbbbbb",".bb.bbbbbbb.",".b...bbbbb..","............","............","............"],
  lula:["............","....pppp....","...pppppp...","..pPppppPp..","..pppppppp..","..ppeppepp..","...pppppp...","..p.p..p.p..","..p.p..p.p..",".p..p..p..p.",".p...pp...p.","............"],
  caranguejo:["............",".oo......oo.","o.o......o.o",".oo.e..e.oo.","..o.o..o.o..","...oooooo...","..oOooooOo..",".oooooooooo.","o.oOOOOOOo.o","..o.o..o.o..",".o..o..o..o.","............"],
  dourada:["............","....yyyy....","...yyyyyy...","y.yyyyyyyy..","yyyYyyyyyey.","yyyYyyyyyyyy","yyyYyyyyyyy.","y.yyyyyyyy..","...yyyyyy...","....yyyy....","............","............"],
  lagosta:[".c........c.","cc........cc","cc..r..r..cc",".c..r..r..c.","..rrrrrrrr..","...rRRRRr...","...rrrrrr...","...rRRRRr...","....rrrr....","....rRRr....","...rrrrrr...","............"],
  coral:["............","..k.....k...","..k..k..k.k.","k.kk.k.kk.k.","kk.k.k.k..k.",".k.kkkkk.kk.",".kk..k..kk..","..kk.k.kk...","...kkkkk....","....kKk.....","...KKKKK....","............"],
  tubarao:["............","............",".....G......","....GG......","G..GGGGGG...","GGGGGGGGGGG.","GGGGGGGGGeGG",".GGuuuuuuuu.","G..uuuuuu...",".....u......","............","............"],
  tartaruga:["....hh......","....hh......","..f.gggg.f..",".ffgvgvggff.","..gvvgvvgg..","..ggvgvgvg..","..gvvgvvgg..",".ffggvgggff.","..f.gggg.f..",".....hh.....","............","............"],
  golfinho:["............","............","......D.....",".....DD.....","...dddddd...","..ddddddded.",".ddwwwwddddd","dd...wwww...","d...........","dd..........","............","............"],
  boat:["............","......w.....","......ww....","......www...","......wwww..","...w..wwwww.","..ww..m.....",".www..m.....","nnnnnnnnnnnn",".nNNNNNNNNn.","..nnnnnnnn..","............"],
  rock:["............","............","....qqqQ....","..qqqqqQQQ..",".qqqQQQQQQQ.",".qqQQQQQQQz.","QqQQQQQQQQzz","QQQQQQQQQzzz",".QQQQQQQzzz.","..zzzzzzzz..","............","............"],
  hook:[".......l....",".......l....",".......l....","......xxx...",".......x....",".......x....",".......x....","..x....x....","..xx...x....","...x...x....","...xx.xx....","....xxx....."],
};
function spriteURL(map){
  const cv=document.createElement('canvas'); cv.width=cv.height=14; const x=cv.getContext('2d');
  const on=(r,c)=>r>=0&&c>=0&&r<12&&c<12&&map[r][c]!=='.';
  for(let r=-1;r<13;r++)for(let c=-1;c<13;c++){
    if(on(r,c)){x.fillStyle=PAL[map[r][c]];x.fillRect(c+1,r+1,1,1)}
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1)){x.fillStyle='#051019';x.fillRect(c+1,r+1,1,1)}
  }
  return cv.toDataURL();
}
const spriteCSS=Object.entries(SPRITES).map(([k,m])=>`.s-${k}{background-image:url(${spriteURL(m)})}`).join('');
document.head.insertAdjacentHTML('beforeend',`<style>${spriteCSS}</style>`);
const sprite=(k,extra='')=>`<i class="sp s-${k}"${extra}></i>`;

function seaURL(g){
  const S=14, cv=document.createElement('canvas'); cv.width=g.cols*S; cv.height=g.rows*S; const x=cv.getContext('2d');
  const rng=mulberry(seedFrom('sea:'+g.key));
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    let base, tick;
    if(g.kind==='net'){base=(r+c)%2?'#174353':'#143B4B';tick='#1C4F60'}
    else if(r===0){base='#1E5B6B';tick='#2A6E7E'}
    else {const d=(r-1)/(g.rows-2);base=`hsl(${196-d*6} ${46-d*10}% ${27-d*15}%)`;tick=`hsl(${196-d*6} ${46-d*10}% ${31-d*15}%)`}
    x.fillStyle=base; x.fillRect(c*S,r*S,S,S);
    x.fillStyle=tick;
    for(let k=0;k<2;k++) if(rng()<.35){const wx=c*S+Math.floor(rng()*8), wy=r*S+2+Math.floor(rng()*10); x.fillRect(wx,wy,3,1); x.fillRect(wx+3,wy-1,2,1)}
  }
  if(g.kind==='line'){x.fillStyle='#E8F0EC';for(let c=0;c<g.cols*S;c+=4)x.fillRect(c,0,2,1)}
  return cv.toDataURL();
}

// ---------- daily date ----------
const EPOCH = '2026-09-01'; // day #1: change to launch date
const now = new Date();
const DATE = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const DAYNUM = Math.round((new Date(DATE+'T12:00:00') - new Date(EPOCH+'T12:00:00'))/864e5) + 1;

// ---------- deterministic randomness ----------
function seedFrom(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(rng,a,b)=>a+Math.floor(rng()*(b-a+1));
function weighted(rng,list){let t=0;for(const x of list)t+=x[1];let v=rng()*t;for(const [k,w] of list){if((v-=w)<0)return k}return list[0][0]}

// ---------- storage ----------
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const emptyGrid=(R,C)=>Array.from({length:R},()=>Array.from({length:C},()=>({rock:false,sp:null})));
const key=(r,c)=>r*100+c;

// ---------- generation: net ----------
function genNet(g,rng){
  const G=emptyGrid(g.rows,g.cols); const [sr,sc]=g.start;
  const inB=(r,c)=>r>=0&&c>=0&&r<g.rows&&c<g.cols;
  const nearBoat=(r,c)=>Math.abs(r-sr)+Math.abs(c-sc)<=2;
  const free=(r,c)=>inB(r,c)&&!G[r][c].rock&&!G[r][c].sp&&!nearBoat(r,c);
  const put=(sp,r,c)=>{if(free(r,c)){G[r][c].sp=sp;return true}return false};
  for(let i=0;i<9;i++){const r=ri(rng,0,g.rows-1),c=ri(rng,0,g.cols-1);if(free(r,c))G[r][c].rock=true}
  const posW=[['sardinha',6],['lula',2],['dourada',2]];
  const negs=['tartaruga','golfinho','tubarao','tartaruga'];
  for(let k=0;k<5;k++){
    const cr=ri(rng,1,g.rows-4), cc=ri(rng,1,g.cols-2);
    let want=ri(rng,4,6);
    for(let t=0;t<30&&want>0;t++){if(put(weighted(rng,posW),cr+ri(rng,-2,2),cc+ri(rng,-2,2)))want--}
    if(k<4){for(let t=0;t<20;t++){if(put(negs[k],cr+ri(rng,-1,1),cc+ri(rng,-1,1)))break}}
  }
  for(let n=2,t=0;n>0&&t<40;t++){if(put('lagosta',ri(rng,0,g.rows-4),ri(rng,0,g.cols-1)))n--}
  for(let n=6,t=0;n>0&&t<60;t++){if(put('sardinha',ri(rng,0,g.rows-1),ri(rng,0,g.cols-1)))n--}
  for(let n=1,t=0;n>0&&t<40;t++){if(put(rng()<.5?'golfinho':'tubarao',ri(rng,0,g.rows-3),ri(rng,0,g.cols-1)))n--}
  return G;
}

// ---------- generation: line ----------
function genLine(g,rng){
  for(let attempt=0;attempt<60;attempt++){
    const G=emptyGrid(g.rows,g.cols); const R=g.rows, C=g.cols;
    const [sr,sc]=g.start;
    const free=(r,c)=>r>=1&&c>=0&&r<R&&c<C&&!G[r][c].rock&&!G[r][c].sp&&!(r===1&&c===sc);
    const zone=(sp,r0,r1,n,rock)=>{for(let t=0;t<80&&n>0;t++){const r=ri(rng,r0,r1),c=ri(rng,0,C-1);if(free(r,c)){if(rock)G[r][c].rock=true;else G[r][c].sp=sp;n--}}};
    zone(null,3,R-1,7,true);
    zone('golfinho',1,4,1);
    zone('tartaruga',3,7,2);
    zone('tubarao',5,9,2);
    zone('coral',R-2,R-1,3);
    zone('sardinha',1,3,7);
    zone('lula',2,5,3);
    zone('dourada',4,8,4);
    zone('caranguejo',R-1,R-1,2);
    zone('lagosta',R-2,R-1,1);
    // make sure a path to the seabed exists
    const dist=new Map([[key(sr,sc),0]]); const q=[[sr,sc]]; let best=Infinity;
    while(q.length){const [r,c]=q.shift();const d=dist.get(key(r,c));if(r===R-1)best=Math.min(best,d);
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr<1||nc<0||nr>=R||nc>=C)continue;const cell=G[nr][nc];if(cell.rock||cell.sp)continue;if(dist.has(key(nr,nc)))continue;dist.set(key(nr,nc),d+1);q.push([nr,nc])}}
    if(best<=g.maxLen-4) return G;
  }
  return emptyGrid(g.rows,g.cols);
}

// ---------- jogos ----------
const games = {
  rede:{key:'rede',kind:'net',cols:11,rows:11,start:[10,5],maxLen:26,gen:genNet,icon:'🕸️',label:'Net'},
  linha:{key:'linha',kind:'line',cols:9,rows:12,start:[0,4],maxLen:20,gen:genLine,icon:'🪝',label:'Line'},
};

// ---------- text ----------
const STR = {
  en:{

let LANG=(()=>{let l=null;try{l=localStorage.getItem('goodcatch:lang')}catch(e){}return l in STR?l:/^pt\b/i.test(navigator.language||'')?'pt':'en'})();
const t=k=>STR[LANG][k]??STR.en[k]??k;
const spName=k=>t('sp_'+k);
function applyText(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':'en';
  document.getElementById('date').textContent=`#${DAYNUM} · ${new Intl.DateTimeFormat(document.documentElement.lang,{month:'short',day:'numeric'}).format(now)}`;
  document.getElementById('lang-btn').textContent=t('other_lang');
  renderLegend();
  document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));
  document.querySelectorAll('[data-t-label]').forEach(n=>{n.setAttribute('aria-label',t(n.dataset.tLabel));n.title=t(n.dataset.tLabel)});
  document.getElementById('help-body').innerHTML=`<p>${t('help_intro')}</p>
    <h3>${sprite('sardinha')}${t('game_rede')}</h3><p>${t('help_rede')}</p>
    <h3>${sprite('hook')}${t('game_linha')}</h3><p>${t('help_linha')}</p>
    <p>${t('help_points')}</p>`;
}

function setup(g){
  const root=document.getElementById('game-'+g.key);
  g.el={}; root.querySelectorAll('[data-k]').forEach(n=>g.el[n.dataset.k]=n);
  g.tab=document.getElementById('tab-'+g.key);
  g.board=g.el.board;
  g.board.style.setProperty('--cols',g.cols); g.board.style.setProperty('--rows',g.rows);
  g.board.style.backgroundImage=`url(${seaURL(g)})`;
  new ResizeObserver(()=>{const cell=g.board.clientWidth/g.cols;g.board.style.setProperty('--spx',14*Math.max(1,Math.floor(cell*.9/14))+'px')}).observe(g.board);
  g.training=false;
  g.storeKey=`goodcatch:${DATE}:${g.key}`;
  g.rec=load(g.storeKey)||{best:null,worst:null,tries:0};
  g.trainRec={best:null,worst:null,tries:0};
  g.last=null;
  newMap(g, DATE+':'+g.key);

  let drawing=false;
  const cellAt=e=>{const b=g.board.getBoundingClientRect();const c=Math.floor((e.clientX-b.left)/b.width*g.cols);const r=Math.floor((e.clientY-b.top)/b.height*g.rows);return (r>=0&&c>=0&&r<g.rows&&c<g.cols)?[r,c]:null};
  g.board.addEventListener('pointerdown',e=>{const cell=cellAt(e);if(!cell)return;drawing=true;try{g.board.setPointerCapture(e.pointerId)}catch(_){}touch(g,cell,true);render(g)});
  g.board.addEventListener('pointermove',e=>{if(!drawing)return;const cell=cellAt(e);if(!cell)return;touch(g,cell,false);render(g)});
  const stop=()=>{drawing=false};
  g.board.addEventListener('pointerup',stop); g.board.addEventListener('pointercancel',stop);
  g.el.undo.addEventListener('click',()=>{if(g.path.length>1){g.path.pop();g.closed=false;g.blocked=null;render(g)}});
  g.el.clear.addEventListener('click',()=>{g.path=[g.start.slice()];g.closed=false;g.blocked=null;render(g)});
  g.el.go.addEventListener('click',()=>commit(g));
  g.el.result.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]')?.dataset.act;
    if(a==='again'){g.last=null;g.path=[g.start.slice()];g.closed=false;render(g)}
    if(a==='share') share(g.el.result.querySelector('.note'));
  });
}

function toggleTraining(g){
  g.training=!g.training;
  if(g.training){g.trainRec={best:null,worst:null,tries:0};newMap(g,'treino:'+Math.random())}
  else newMap(g,DATE+':'+g.key);
  g.last=null; render(g);
}

function newMap(g,seed){
  g.grid=g.gen(g,mulberry(seedFrom(seed)));
  g.path=[g.start.slice()]; g.closed=false;
}

const stepCost=(g,r,c)=>g.kind==='line'&&g.grid[r][c].sp?2:1;
const moves=g=>g.path.slice(1).reduce((s,[r,c])=>s+stepCost(g,r,c),0);
const isStart=(g,r,c)=>r===g.start[0]&&c===g.start[1];
function returnPath(g,from,extra){
  const [sr,sc]=g.start, walls=new Set(g.path.slice(1).map(([r,c])=>key(r,c)));
  if(extra) walls.add(key(extra[0],extra[1]));
  walls.delete(key(from[0],from[1]));
  const prev=new Map([[key(from[0],from[1]),null]]), q=[from];
  for(let i=0;i<q.length;i++){
    const [r,c]=q[i];
    if(r===sr&&c===sc){const out=[];for(let k=key(r,c);k!==null;k=prev.get(k))out.push([Math.floor(k/100),k%100]);return out.reverse()}
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr,nc=c+dc,k=key(nr,nc);
      if(nr<0||nc<0||nr>=g.rows||nc>=g.cols||prev.has(k)||walls.has(k)||g.grid[nr][nc].rock) continue;
      prev.set(k,key(r,c)); q.push([nr,nc]);
    }
  }
  return null;
}
// null = allowed; otherwise why not. Silent reasons are not shown to the player.
function stepBlock(g,r,c){
  if(r<0||c<0||r>=g.rows||c>=g.cols) return 'silent';
  const e=g.path[g.path.length-1];
  if(Math.abs(e[0]-r)+Math.abs(e[1]-c)!==1) return 'silent';
  if(g.kind==='net'&&g.closed) return 'silent';
  if(g.grid[r][c].rock) return 'rock';
  const left=g.maxLen-moves(g)-stepCost(g,r,c);
  if(g.kind==='net'){
    if(isStart(g,r,c)) return g.path.length>=4?null:'silent';
    if(g.path.some(p=>p[0]===r&&p[1]===c)) return 'self';
    const back=returnPath(g,[r,c],[r,c]);
    return back&&back.length-1<=left?null:'noway';
  }
  if(r<1) return 'silent';
  if(g.path.some(p=>p[0]===r&&p[1]===c)) return 'self';
  if(left<0) return 'budget';
  return left>=g.rows-1-r?null:'noway';
}
function touch(g,[r,c],isDown){
  const L=g.path.length;
  const idx=g.path.findIndex(p=>p[0]===r&&p[1]===c);
  const closing=g.kind==='net'&&idx===0&&!g.closed&&L>=4;
  if(isDown&&idx>=0&&!closing){g.path=g.path.slice(0,idx+1);g.closed=false;g.blocked=null;return}
  const end=g.path[L-1];
  if(end[0]===r&&end[1]===c) return;
  if(L>=2){const p=g.path[L-2];if(p[0]===r&&p[1]===c){g.path.pop();g.closed=false;g.blocked=null;return}}
  if(closing){
    const back=returnPath(g,end);
    if(back&&back.length-1<=g.maxLen-moves(g)&&L+back.length-2>=4){g.path.push(...back.slice(1));g.closed=true;g.blocked=null;return}
  }
  for(let i=0;i<40;i++){
    if(g.closed) break;
    const e=g.path[g.path.length-1]; if(e[0]===r&&e[1]===c) break;
    const dr=Math.sign(r-e[0]), dc=Math.sign(c-e[1]);
    const a=[e[0]+dr,e[1]], b=[e[0],e[1]+dc];
    const opts=(Math.abs(r-e[0])>=Math.abs(c-e[1])?[a,b]:[b,a]).filter(([nr,nc])=>nr!==e[0]||nc!==e[1]);
    const why=opts.map(([nr,nc])=>stepBlock(g,nr,nc));
    const ok=why.indexOf(null);
    if(ok<0){
      const [br,bc]=opts[0], k=`${br},${bc},${why[0]}`;
      if(why[0]!=='silent'&&g.blocked!==k){g.blocked=k;g.blockReason=why[0];spawn(g,br,bc,'blocked')}
      break;
    }
    const [nr,nc]=opts[ok];
    g.path.push([nr,nc]); g.blocked=null;
    if(g.kind==='net'&&isStart(g,nr,nc)) g.closed=true;
    if(stepCost(g,nr,nc)===2) spawn(g,nr,nc,'cost','−2');
  }
}
function spawn(g,r,c,kind,text=''){
  const b=g.board, m=document.createElement('div');
  m.className='mark '+kind; m.textContent=text;
  m.style.cssText=`left:${b.offsetLeft+c*b.clientWidth/g.cols}px;top:${b.offsetTop+r*b.clientHeight/g.rows}px;width:${b.clientWidth/g.cols}px;height:${b.clientHeight/g.rows}px`;
  b.parentNode.appendChild(m); m.addEventListener('animationend',e=>{if(e.animationName!=='shake')m.remove()});
}

function evaluate(g){
  const onP=new Set(g.path.map(p=>key(p[0],p[1])));
  const hits=[]; let inside=null;
  if(g.kind==='net'){
    if(!g.closed) return {hits:null,inside:null,onP};
    const out=new Set(); const q=[];
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
      if((r===0||c===0||r===g.rows-1||c===g.cols-1)&&!onP.has(key(r,c))){out.add(key(r,c));q.push([r,c])}
    }
    while(q.length){const [r,c]=q.pop();for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=key(nr,nc);if(nr<0||nc<0||nr>=g.rows||nc>=g.cols||onP.has(k)||out.has(k))continue;out.add(k);q.push([nr,nc])}}
    inside=new Set();
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){const k=key(r,c);if(!onP.has(k)&&!out.has(k)){inside.add(k);if(g.grid[r][c].sp)hits.push([r,c])}}
  } else {
    const seen=new Set();
    for(const [r,c] of g.path){const sp=g.grid[r][c].sp;if(sp&&SP[sp].p<0&&!seen.has(key(r,c))){seen.add(key(r,c));hits.push([r,c])}}
    for(const [r,c] of g.path){for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=key(nr,nc);if(nr<0||nc<0||nr>=g.rows||nc>=g.cols||onP.has(k)||seen.has(k))continue;if(g.grid[nr][nc].sp){seen.add(k);hits.push([nr,nc])}}}
  }
  return {hits,inside,onP};
}
const scoreOf=(g,hits)=>hits.reduce((s,[r,c])=>s+SP[g.grid[r][c].sp].p,0);
const ready=g=>g.kind==='net'?g.closed:g.path[g.path.length-1][0]===g.rows-1;
const fmt=s=>s>0?'+'+s:s<0?'−'+Math.abs(s):'0';
const cls=s=>s>0?'good':s<0?'bad':'zero';

function render(g){
  const {hits,inside,onP}=evaluate(g);
  const hitSet=new Set((hits||[]).map(([r,c])=>key(r,c)));
  let html='';
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    const cell=g.grid[r][c], k=key(r,c), cl=['c']; let inner='';
    if(inside&&inside.has(k)) cl.push('in');
    if(cell.rock) inner=sprite('rock');
    if(isStart(g,r,c)) inner=sprite('boat');
    else if(cell.sp){
      const s=SP[cell.sp]; if(s.p<0) cl.push('neg');
      if(hitSet.has(k)) cl.push('hit', s.p>0?'good':'bad');
      if(onP.has(k)&&!hitSet.has(k)) cl.push('gone');
      if(cell.sp===spotlight) cl.push('lit');
      inner=sprite(cell.sp,` title="${spName(cell.sp)} ${fmt(s.p)}"`);
    }
    html+=`<div class="${cl.join(' ')}">${inner}</div>`;
  }
  const pts=g.path.map(([r,c])=>`${c+.5},${r+.5}`).join(' ');
  const e=g.path[g.path.length-1];
  let svg=`<svg class="ov" viewBox="0 0 ${g.cols} ${g.rows}" preserveAspectRatio="none" aria-hidden="true">`;
  if(g.kind==='net'){
    svg+=`<polyline points="${pts}" fill="none" stroke="#EBDDB4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
    g.path.forEach(([r,c],i)=>{if(i>0&&i%2===0&&!isStart(g,r,c))svg+=`<circle cx="${c+.5}" cy="${r+.5}" r=".13" fill="#F39A36"/>`});
  } else {
    svg+=`<polyline points="${pts}" fill="none" stroke="#EBDDB4" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    if(g.path.length>1) svg+=`<circle cx="${e[1]+.5}" cy="${e[0]+.5}" r=".15" fill="${ready(g)?'#F39A36':'#EBDDB4'}"/>`;
  }
  const back=g.kind==='net'&&!g.closed&&g.path.length>1?returnPath(g,e):null;
  if(back) svg+=`<polyline points="${back.map(([r,c])=>`${c+.5},${r+.5}`).join(' ')}" fill="none" stroke="#F39A36" stroke-opacity=".75" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  svg+='</svg>';
  g.board.innerHTML=html+svg;
  const left=g.maxLen-moves(g), need=back?back.length-1:g.kind==='line'?g.rows-1-e[0]:0;
  const warn=!ready(g)&&g.path.length>1&&left-need<=1;
  g.board.classList.toggle('spot',!!spotlight);

  g.el.count.innerHTML=`${t('left_'+g.key)}: <b>${left}</b>`;
  g.el.count.classList.toggle('warn',warn);
  g.el.pv.innerHTML=hits?`${t('catch')}: <b class="${cls(scoreOf(g,hits))}">${fmt(scoreOf(g,hits))}</b>`:`${t('catch')}: <b>—</b>`;
  g.el.pv.className='pv '+(hits?cls(scoreOf(g,hits)):'');
  g.el.hint.textContent=g.blocked?t(`block_${g.blockReason}_${g.key}`)
    :warn?t(`hint_${g.key}_warn`).replace('{n}',need)
    :t(`hint_${g.key}_${ready(g)?'ready':g.path.length>1?'go':'start'}`);
  g.el.hint.classList.toggle('alert',!!g.blocked);
  g.el.go.disabled=!ready(g);
  g.el.undo.disabled=g.path.length<2; g.el.clear.disabled=g.path.length<2;
  g.el.train.hidden=!g.training;
  g.tab.querySelector('small').textContent=g.rec.tries?`▲${fmt(g.rec.best)}`:'';
  if(g===current()) document.getElementById('train-btn').textContent=t(g.training?'practice_off':'practice_on');
  renderResult(g);
}

function verdict(s){return t(s>=25?'v1':s>=12?'v2':s>0?'v3':s===0?'v4':s>-15?'v5':'v6')}

function renderResult(g){
  const L=g.last; g.el.result.hidden=!L; g.el.board.closest('.game').classList.toggle('done',!!L); if(!L) return;
  const rec=g.training?g.trainRec:g.rec;
  const chips=Object.entries(L.count).sort((a,b)=>SP[b[0]].p-SP[a[0]].p).map(([k,n])=>{const p=SP[k].p*n;return `<span title="${spName(k)}">${sprite(k)}×${n} <span class="${p>0?'pos':'neg-t'}">${fmt(p)}</span></span>`}).join('')||`<span>${t('nothing')}</span>`;
  g.el.result.innerHTML=`<div class="big ${cls(L.score)}">${fmt(L.score)}</div>
    <div class="verdict">${verdict(L.score)}</div>
    <div class="chips">${chips}</div>
    <div class="recs"><span>${t('your_best')} <b class="big-${cls(rec.best)}">▲${fmt(rec.best)}</b></span><span>${t('your_lowest')} <b class="big-${cls(rec.worst)}">▼${fmt(rec.worst)}</b></span></div>
    <div class="controls"><button class="btn" data-act="again">${t('try_again')}</button><button class="btn primary" data-act="share"${g.training?' disabled':''}>${t('share')}</button></div>
    <p class="note" aria-live="polite"></p>`;
}

function commit(g){
  if(!ready(g)) return;
  const {hits}=evaluate(g); const score=scoreOf(g,hits);
  const count={}; for(const [r,c] of hits){const k=g.grid[r][c].sp;count[k]=(count[k]||0)+1}
  g.last={score,count};
  const rec=g.training?g.trainRec:g.rec;
  rec.tries++; rec.best=rec.best===null?score:Math.max(rec.best,score); rec.worst=rec.worst===null?score:Math.min(rec.worst,score);
  if(!g.training) save(g.storeKey,rec);
  render(g);
}

function shareText(){
  let s=`Good Catch #${DAYNUM}\n`;
  for(const g of Object.values(games)){
    const r=g.rec;
    s+= r.tries ? `${g.icon} ${t('game_'+g.key)} ▲${fmt(r.best)} ▼${fmt(r.worst)}\n` : `${g.icon} ${t('game_'+g.key)} ${t('not_played')}\n`;
  }
  return s+'goodcatch.fish';
}
function share(note){
  const txt=shareText();
  const fail=()=>{note.textContent=t('copy_fail')+txt.replace(/\n/g,' · ')};
  try{navigator.clipboard.writeText(txt).then(()=>{note.textContent=t('copied')},fail)}catch(e){fail()}
}

let spotlight=null;
const legend=document.getElementById('legend');
function renderLegend(){
  legend.innerHTML=Object.entries(SP).sort((a,b)=>b[1].p-a[1].p).map(([k,s])=>
    `<button data-sp="${k}" aria-pressed="${k===spotlight}" aria-label="${spName(k)} ${fmt(s.p)}" title="${spName(k)}">${sprite(k)}<span class="${s.p>0?'pos':'neg-t'}">${fmt(s.p)}</span></button>`).join('');
}
legend.addEventListener('click',e=>{
  const b=e.target.closest('[data-sp]'); if(!b) return;
  spotlight=spotlight===b.dataset.sp?null:b.dataset.sp;
  legend.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.sp===spotlight)));
  render(current());
});

let tab='rede';
const current=()=>games[tab];
function showTab(k){
  tab=k;
  for(const x of ['rede','linha']){document.getElementById('game-'+x).hidden=x!==k;document.getElementById('tab-'+x).setAttribute('aria-selected',String(x===k))}
  try{localStorage.setItem('goodcatch:tab',k)}catch(e){}
  render(current());
}
document.getElementById('tab-rede').addEventListener('click',()=>showTab('rede'));
document.getElementById('tab-linha').addEventListener('click',()=>showTab('linha'));
document.getElementById('train-btn').addEventListener('click',()=>{toggleTraining(current());document.getElementById('menu').hidePopover()});
document.getElementById('lang-btn').addEventListener('click',()=>{
  LANG=LANG==='pt'?'en':'pt'; try{localStorage.setItem('goodcatch:lang',LANG)}catch(e){}
  applyText(); render(games.rede); render(games.linha); document.getElementById('menu').hidePopover();
});
const help=document.getElementById('help');
document.getElementById('help-btn').addEventListener('click',()=>help.showModal());

applyText();
setup(games.rede); setup(games.linha);
let saved=null; try{saved=localStorage.getItem('goodcatch:tab')}catch(e){}
showTab(saved==='linha'?'linha':'rede');
render(games.rede); render(games.linha);
let seen=null; try{seen=localStorage.getItem('goodcatch:seenHelp')}catch(e){}
if(!seen){help.showModal();try{localStorage.setItem('goodcatch:seenHelp','1')}catch(e){}}
})();
</script>
</body>
</html>
